name: XENEON Real iCUE Preliminary Recovery

on:
  push:
    branches:
      - 'recovery/xeneon-real-icue-prelim-20260828'
    paths:
      - 'tools/xeneon/inline.py'
      - 'tools/xeneon/native-style-smoke.mjs'
      - 'tools/xeneon/icue-runner-smoke.mjs'
      - 'tools/xeneon/desk-notes-settings-smoke.mjs'
      - 'tools/xeneon/pc-power-sensor-init-smoke.mjs'
      - 'widgets/_src/desk-notes/**'
      - 'widgets/_src/desk-notes-pro/**'
      - 'widgets/_src/desk-notes-common/**'
      - 'widgets/_src/weather-timeline/**'
      - 'widgets/_src/weather-timeline-pro/**'
      - 'widgets/_src/pc-power-meter/**'
      - 'widgets/_src/pc-power-meter-pro/**'
      - 'widgets/_shared/pc-power-meter/**'
      - 'widgets/pc-power-meter/manifest.json'
      - 'widgets/pc-power-meter-pro/manifest.json'
      - '.github/workflows/xeneon-real-icue-prelim-recovery.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/xeneon/inline.py'
      - 'tools/xeneon/desk-notes-settings-smoke.mjs'
      - 'tools/xeneon/pc-power-sensor-init-smoke.mjs'
      - 'widgets/_src/desk-notes/**'
      - 'widgets/_src/desk-notes-pro/**'
      - 'widgets/_src/desk-notes-common/**'
      - 'widgets/_src/weather-timeline/**'
      - 'widgets/_src/weather-timeline-pro/**'
      - 'widgets/_src/pc-power-meter/**'
      - 'widgets/_src/pc-power-meter-pro/**'
      - 'widgets/_shared/pc-power-meter/**'
      - 'widgets/pc-power-meter/manifest.json'
      - 'widgets/pc-power-meter-pro/manifest.json'
      - '.github/workflows/xeneon-real-icue-prelim-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    name: Real iCUE recovery • ${{ matrix.slug }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        slug:
          - desk-notes
          - desk-notes-pro
          - weather-timeline
          - weather-timeline-pro
          - pc-power-meter
          - pc-power-meter-pro

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate exact shipping widget
        shell: pwsh
        run: |
          python tools/xeneon/inline.py '${{ matrix.slug }}'
          if ($LASTEXITCODE -ne 0) { throw 'inline generation failed' }
          python tools/xeneon/inline.py '${{ matrix.slug }}' --check
          if ($LASTEXITCODE -ne 0) { throw 'deterministic generation check failed' }

      - name: Official validate and package
        shell: pwsh
        run: |
          npx --yes icuewidget-cli@0.4.47 validate 'widgets/${{ matrix.slug }}'
          if ($LASTEXITCODE -ne 0) { throw 'official validation failed' }
          Get-ChildItem -Path widgets -Filter *.icuewidget -File -ErrorAction SilentlyContinue | Remove-Item -Force
          npx --yes icuewidget-cli@0.4.47 package 'widgets/${{ matrix.slug }}'
          if ($LASTEXITCODE -ne 0) { throw 'official packaging failed' }

      - name: Capture and verify exact official package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/package | Out-Null
          New-Item -ItemType Directory -Force -Path 'artifacts/extracted/${{ matrix.slug }}' | Out-Null
          $pkg = Get-ChildItem -Path widgets -Filter *.icuewidget -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $pkg) { throw 'official package was not created' }
          Copy-Item $pkg.FullName 'artifacts/package/${{ matrix.slug }}.icuewidget'
          @'
          import pathlib, zipfile, json
          slug = '${{ matrix.slug }}'
          package = pathlib.Path('artifacts/package') / f'{slug}.icuewidget'
          out = pathlib.Path('artifacts/extracted') / slug
          if not zipfile.is_zipfile(package):
              raise SystemExit('package is not ZIP-compatible')
          with zipfile.ZipFile(package) as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f'corrupt package member: {bad}')
              names = set(archive.namelist())
              for required in ('index.html', 'manifest.json'):
                  if required not in names:
                      raise SystemExit(f'missing root {required}')
              archive.extractall(out)
          manifest = json.loads((out / 'manifest.json').read_text(encoding='utf-8-sig'))
          version = str(manifest.get('version', manifest.get('Version', '')))
          if not version or version.split('.', 1)[0] != '1':
              raise SystemExit(f'Marketplace revision must remain major Version 1, found {version!r}')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'exact package integrity/version check failed' }

      - name: Reject unsupported Weather control attributes
        if: startsWith(matrix.slug, 'weather-timeline')
        shell: pwsh
        run: |
          @'
          import pathlib
          p = pathlib.Path('artifacts/extracted/${{ matrix.slug }}/index.html')
          html = p.read_text(encoding='utf-8')
          if 'data-options=' in html:
              raise SystemExit('Weather package still contains unsupported data-options')
          for control in ('temperatureUnits', 'theme'):
              marker = f'content="{control}"'
              pos = html.find(marker)
              if pos < 0:
                  raise SystemExit(f'missing {control} control')
              tag_start = html.rfind('<meta', 0, pos)
              tag_end = html.find('>', pos)
              tag = html[tag_start:tag_end + 1]
              if 'data-values=' not in tag:
                  raise SystemExit(f'{control} is missing required data-values')
          '@ | python -

      - name: Install Playwright
        shell: pwsh
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install chromium

      - name: Exact-package Custom Style regression
        if: matrix.slug == 'desk-notes' || matrix.slug == 'desk-notes-pro' || matrix.slug == 'pc-power-meter' || matrix.slug == 'pc-power-meter-pro'
        shell: pwsh
        run: node tools/xeneon/native-style-smoke.mjs 'artifacts/extracted/${{ matrix.slug }}/index.html' 'artifacts/native-style/${{ matrix.slug }}'

      - name: Desk Notes content, layout, behavior, and no-delay regression
        if: startsWith(matrix.slug, 'desk-notes')
        shell: pwsh
        run: node tools/xeneon/desk-notes-settings-smoke.mjs 'artifacts/extracted/${{ matrix.slug }}/index.html' 'artifacts/desk-notes/${{ matrix.slug }}'

      - name: PC Power delayed Sensors plugin initialization regression
        if: startsWith(matrix.slug, 'pc-power-meter')
        shell: pwsh
        run: node tools/xeneon/pc-power-sensor-init-smoke.mjs 'artifacts/extracted/${{ matrix.slug }}/index.html' 'artifacts/power-sensor-init/${{ matrix.slug }}'

      - name: Clone Corsair Labs iCUE Widget Runner
        shell: pwsh
        run: |
          $runnerDir = Join-Path $env:RUNNER_TEMP 'icue-widget-runner-windows'
          if (Test-Path $runnerDir) { Remove-Item -Recurse -Force $runnerDir }
          git clone --depth 1 https://github.com/Corsair-Labs/iCUE-widget-runner-windows.git $runnerDir
          git -C $runnerDir rev-parse HEAD | Set-Content artifacts/corsair-runner-commit.txt
          $target = Join-Path (Join-Path $runnerDir 'widgets') '${{ matrix.slug }}'
          if (Test-Path $target) { Remove-Item -Recurse -Force $target }
          Copy-Item -Recurse -Force 'artifacts/extracted/${{ matrix.slug }}' $target

      - name: Corsair Labs exact-package host smoke
        shell: pwsh
        run: |
          $runnerDir = Join-Path $env:RUNNER_TEMP 'icue-widget-runner-windows'
          $stdout = Join-Path $env:RUNNER_TEMP 'corsair-runner.out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'corsair-runner.err.log'
          $process = Start-Process node -ArgumentList 'web-server.js' -WorkingDirectory $runnerDir -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8080/api/widgets -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'Corsair Labs runner did not become ready' }
            node tools/xeneon/icue-runner-smoke.mjs http://127.0.0.1:8080/ '${{ matrix.slug }}' 'artifacts/icue-runner/${{ matrix.slug }}'
            if ($LASTEXITCODE -ne 0) { throw 'Corsair Labs host smoke failed' }
          }
          finally {
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            if (Test-Path $stdout) { Copy-Item $stdout artifacts/corsair-runner.stdout.log }
            if (Test-Path $stderr) { Copy-Item $stderr artifacts/corsair-runner.stderr.log }
          }

      - name: Write exact package SHA256
        shell: pwsh
        run: |
          $hash = Get-FileHash 'artifacts/package/${{ matrix.slug }}.icuewidget' -Algorithm SHA256
          "$($hash.Hash.ToLower())  ${{ matrix.slug }}.icuewidget" | Set-Content -Encoding ASCII artifacts/SHA256SUM.txt

      - name: Upload exact package and recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: real-icue-recovery-${{ matrix.slug }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
