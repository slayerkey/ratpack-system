name: One time Voice Panel brand cleanup

on:
  push:
    branches:
      - product/discord-panel
    paths:
      - '.github/workflows/voice-brand-cleanup-panel.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/discord-panel
      - name: Replace legacy product names
        run: |
          python - <<'PY'
          import json, pathlib

          root = pathlib.Path('.')
          paths = list((root / 'widgets' / '_src' / 'discord-panel').glob('*'))
          paths += list((root / 'widgets' / 'discord-panel').glob('*'))
          paths += [root / 'products' / 'discord-panel.json']
          replacements = {
              'Discord Voice Panel': 'PackRat Voice Panel',
              'PackRat Discord Bridge': 'PackRat Voice Bridge',
              'Starting Discord Panel': 'Starting Voice Panel',
          }
          for path in paths:
              if not path.is_file() or path.suffix.lower() not in {'.md', '.json', '.js', '.mjs', '.html', '.css', '.txt'}:
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          translations = root / 'widgets' / 'discord-panel' / 'translation.json'
          data = json.loads(translations.read_text(encoding='utf-8'))
          for locale in data.values():
              table = locale.get('translation', {})
              if 'PackRat Voice Panel' in table:
                  table['PackRat Voice Panel'] = 'PackRat Voice Panel'
          translations.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Remove one time workflow and commit
        run: |
          rm .github/workflows/voice-brand-cleanup-panel.yml
          git config user.name "PackRat Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add widgets/_src/discord-panel widgets/discord-panel products/discord-panel.json .github/workflows/voice-brand-cleanup-panel.yml
          git diff --cached --quiet && exit 0
          git commit -m "Finish trademark safe Voice Panel naming"
          git push origin HEAD:product/discord-panel
