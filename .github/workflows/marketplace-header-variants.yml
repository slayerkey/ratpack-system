name: Marketplace Header Variants

on:
  pull_request:
    paths:
      - 'tools/art/marketplace_header_variants.py'
      - '.github/workflows/marketplace-header-variants.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-header-variants:
    runs-on: windows-latest
    env:
      RATPACK_ART_FONT: C:\Windows\Fonts\segoeui.ttf
      RATPACK_ART_FONT_BOLD: C:\Windows\Fonts\segoeuib.ttf

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install deterministic art dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==12.3.0
          npm install --no-save playwright@1.62.1
          npx playwright install chromium

      - name: Build PC Power Meter Pro from canonical source
        shell: pwsh
        run: python tools/xeneon/inline.py pc-power-meter-pro

      - name: Capture real PC Power Meter Pro product state
        shell: pwsh
        run: node tools/art/capture_xeneon.mjs pc-power-meter-pro artifacts/header-variants/shots

      - name: Render six header variants
        shell: pwsh
        run: python tools/art/marketplace_header_variants.py --shots artifacts/header-variants/shots --out artifacts/header-variants/review

      - name: Verify comparison set
        shell: pwsh
        run: |
          foreach ($name in @('01.png','02.png','03.png','04.png','05.png','06.png','contact-sheet.jpg','thumbnail-sheet.jpg')) {
            if (-not (Test-Path "artifacts/header-variants/review/$name")) { throw "Missing $name" }
          }

      - name: Upload header variants
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-header-variants
          path: artifacts/header-variants/review/
          if-no-files-found: error
          retention-days: 30
