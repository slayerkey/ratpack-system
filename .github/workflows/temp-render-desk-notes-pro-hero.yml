name: Temp Render Desk Notes Pro Hero

on:
  push:
    branches:
      - temp/render-desk-notes-pro-hero

permissions:
  contents: read

jobs:
  render:
    runs-on: windows-latest
    env:
      WIDGET_SLUG: desk-notes-pro
      RATPACK_ART_FONT: C:\Windows\Fonts\segoeui.ttf
      RATPACK_ART_FONT_BOLD: C:\Windows\Fonts\segoeuib.ttf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install deterministic art dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==12.3.0
          npm install --no-save playwright@1.62.1
          npx playwright install chromium

      - name: Build widget
        shell: pwsh
        run: python tools/xeneon/inline.py $env:WIDGET_SLUG

      - name: Capture widget
        shell: pwsh
        run: node tools/art/capture_xeneon.mjs $env:WIDGET_SLUG "artifacts/rat-art/shots"

      - name: Render canonical Rat Art
        shell: pwsh
        run: python tools/art/rat_art.py xeneon $env:WIDGET_SLUG --shots "artifacts/rat-art/shots" --out "artifacts/rat-art/review"

      - name: Upload hero only
        uses: actions/upload-artifact@v4
        with:
          name: desk-notes-pro-hero
          path: artifacts/rat-art/review/1-hero.png
          if-no-files-found: error
          retention-days: 1
