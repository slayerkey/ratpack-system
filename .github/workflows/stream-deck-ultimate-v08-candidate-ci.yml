name: Stream Deck Ultimate v0.8 Prepromotion CI

on:
  push:
    branches:
      - product/stream-deck-ultimate-bundle
    paths:
      - 'products/stream-deck-ultimate-bundle/experiments/per-app-audio/**'
      - 'products/stream-deck-ultimate-bundle/prototype/tools/context_smoke_test_v7.js'
      - 'products/stream-deck-ultimate-bundle/prototype/tools/diagnostics_smoke_test_v71.js'
      - '.github/workflows/stream-deck-ultimate-v08-candidate-ci.yml'
  workflow_dispatch:

jobs:
  windows-v08-prepromotion:
    runs-on: windows-latest
    timeout-minutes: 16
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: v0.8 integration source syntax
        run: |
          node --check products/stream-deck-ultimate-bundle/experiments/per-app-audio/v08-app-audio-adapter.js
          node --check products/stream-deck-ultimate-bundle/experiments/per-app-audio/plugin-v08-shadow.cjs
          node --check products/stream-deck-ultimate-bundle/experiments/per-app-audio/v08-candidate-runtime-smoke.js
          node --check products/stream-deck-ultimate-bundle/experiments/per-app-audio/upgrade-regression-v08.js
          node --check products/stream-deck-ultimate-bundle/experiments/per-app-audio/runtime-factory.js
          node --check products/stream-deck-ultimate-bundle/experiments/per-app-audio/streamdeck-bridge.js
          node --check products/stream-deck-ultimate-bundle/experiments/per-app-audio/worker-client.js
          node --check products/stream-deck-ultimate-bundle/prototype/tools/context_smoke_test_v7.js
          node --check products/stream-deck-ultimate-bundle/prototype/tools/diagnostics_smoke_test_v71.js

      - name: v0.8 staging and promotion PowerShell syntax
        shell: powershell
        run: |
          foreach ($file in @(
            'products/stream-deck-ultimate-bundle/experiments/per-app-audio/build-helper.ps1',
            'products/stream-deck-ultimate-bundle/experiments/per-app-audio/prepare-v08-candidate.ps1',
            'products/stream-deck-ultimate-bundle/experiments/per-app-audio/promote-v08.ps1',
            'products/stream-deck-ultimate-bundle/experiments/per-app-audio/app-audio-worker.ps1'
          )) {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }
          Write-Host 'v0.8 prepromotion and guarded promotion PowerShell syntax parsed'

      - name: Promotion guard rejects pending approval and allows plan only after full approval
        shell: powershell
        run: |
          $script = 'products/stream-deck-ultimate-bundle/experiments/per-app-audio/promote-v08.ps1'
          $template = 'products/stream-deck-ultimate-bundle/experiments/per-app-audio/hardware-approval-v08.template.json'
          $blocked = $false
          try { & $script -ApprovalPath $template | Out-Null } catch { $blocked = $true; Write-Host "pending approval correctly blocked: $($_.Exception.Message)" }
          if (-not $blocked) { throw 'Pending hardware approval unexpectedly opened production promotion gate' }

          $approval = Get-Content -LiteralPath $template -Raw | ConvertFrom-Json
          $approval.hostTest.result = 'pass'
          $approval.hostTest.writeAndRestorePass = $true
          $approval.labTest.result = 'pass'
          foreach ($gate in @(
            'currentAppFollowsForeground','specificAppTargetsSelectedProcess','keypadMuteToggle','dialVolume',
            'dialPushMuteToggle','waitingStateSafe','audioOffStateSafe','focusChangeDoesNotRetargetBurst',
            'propertyInspectorAppList','manualProcessName','labRemovalLeavesV071Unaffected'
          )) { $approval.labTest.$gate = $true }
          $approval.allowProductionPromotion = $true
          $approval.approvedAt = '2026-08-31T00:00:00Z'
          $approved = Join-Path $env:RUNNER_TEMP 'v08-hardware-approval-ci.json'
          [IO.File]::WriteAllText($approved, ($approval | ConvertTo-Json -Depth 10), [Text.UTF8Encoding]::new($false))
          $plan = (& $script -ApprovalPath $approved) | ConvertFrom-Json
          if (-not $plan.ok -or $plan.mode -ne 'plan' -or -not $plan.hardwareGatesPassed -or -not $plan.sourceStillMatchesApprovedCandidate) {
            throw 'Fully approved promotion record did not produce the expected read-only plan'
          }
          git diff --exit-code -- products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin
          Write-Host 'promotion guard passed: pending blocks; complete approval yields plan without touching canonical source'

      - name: Build precompiled App Volume helper
        shell: powershell
        run: |
          $json = & 'products/stream-deck-ultimate-bundle/experiments/per-app-audio/build-helper.ps1'
          $build = $json | ConvertFrom-Json
          if (-not $build.ok) { throw 'v0.8 helper build did not report ok' }
          if ($build.type -ne 'PackRatAppAudio.Core') { throw "Unexpected helper type: $($build.type)" }
          if ($build.foregroundType -ne 'PackRatAppAudio.Foreground') { throw "Unexpected foreground helper type: $($build.foregroundType)" }
          if (-not (Test-Path -LiteralPath $build.path)) { throw "v0.8 helper missing: $($build.path)" }
          "PACKRAT_V08_DLL=$($build.path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKRAT_V08_DLL_SHA=$($build.sha256)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "v0.8 helper built: $($build.sizeBytes) bytes sha256=$($build.sha256)"

      - name: Stage v0.8 candidate from frozen v0.7.1
        shell: powershell
        run: |
          $json = & 'products/stream-deck-ultimate-bundle/experiments/per-app-audio/prepare-v08-candidate.ps1' -AssemblyPath $env:PACKRAT_V08_DLL
          $candidate = $json | ConvertFrom-Json
          if (-not $candidate.ok) { throw 'v0.8 candidate staging did not report ok' }
          if ($candidate.pluginUuid -ne 'com.packrat.stream-deck-ultimate-bundle') { throw "Unexpected candidate plugin UUID: $($candidate.pluginUuid)" }
          if ($candidate.actionUuid -ne 'com.packrat.stream-deck-ultimate-bundle.app-audio') { throw "Unexpected candidate action UUID: $($candidate.actionUuid)" }
          if ($candidate.version -ne '0.8.0.0') { throw "Unexpected candidate version: $($candidate.version)" }
          if ($candidate.helperSha256 -ne $env:PACKRAT_V08_DLL_SHA) { throw 'v0.8 candidate helper hash mismatch' }
          "PACKRAT_V08_CANDIDATE=$($candidate.candidateDir)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "staged v0.8 candidate: $($candidate.fileCount) files helper=$($candidate.helperSha256)"

      - name: Accepted v0.7.1 source remains byte-clean
        shell: powershell
        run: |
          git diff --exit-code -- products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin
          if ($LASTEXITCODE -ne 0) { throw 'Accepted v0.7.1 source directory changed during candidate staging' }
          Write-Host 'accepted v0.7.1 source directory remains untouched'

      - name: Install locked candidate runtime dependency
        shell: powershell
        run: |
          Push-Location $env:PACKRAT_V08_CANDIDATE
          try { npm ci --omit=dev --ignore-scripts --no-audit --no-fund } finally { Pop-Location }

      - name: Frozen v0.6 product logic regression
        run: node products/stream-deck-ultimate-bundle/prototype/tools/v06_product_logic_test.js "$env:PACKRAT_V08_CANDIDATE"

      - name: Frozen v0.7 Smart Context logic regression
        run: node products/stream-deck-ultimate-bundle/prototype/tools/context_logic_test_v7.js "$env:PACKRAT_V08_CANDIDATE"

      - name: Frozen v0.7.1 diagnostics privacy regression
        run: node products/stream-deck-ultimate-bundle/prototype/tools/diagnostics_logic_test_v71.js "$env:PACKRAT_V08_CANDIDATE"

      - name: Frozen core through v0.8 multiplexed CodePath
        env:
          PACKRAT_AUDIO_MOCK: '1'
          PACKRAT_APP_AUDIO_MOCK: '1'
        run: node products/stream-deck-ultimate-bundle/prototype/tools/runtime_smoke_test_v6.js "$env:PACKRAT_V08_CANDIDATE"

      - name: Smart Context through v0.8 multiplexed CodePath
        env:
          PACKRAT_AUDIO_MOCK: '1'
          PACKRAT_APP_AUDIO_MOCK: '1'
          PACKRAT_CONTEXT_MOCK: '1'
          PACKRAT_CONTEXT_PROCESS: 'chrome'
        run: node products/stream-deck-ultimate-bundle/prototype/tools/context_smoke_test_v7.js "$env:PACKRAT_V08_CANDIDATE"

      - name: Diagnostics through v0.8 multiplexed CodePath
        env:
          PACKRAT_AUDIO_MOCK: '1'
          PACKRAT_APP_AUDIO_MOCK: '1'
          PACKRAT_CONTEXT_MOCK: '1'
          PACKRAT_DIAGNOSTICS_MOCK: '1'
        run: node products/stream-deck-ultimate-bundle/prototype/tools/diagnostics_smoke_test_v71.js "$env:PACKRAT_V08_CANDIDATE"

      - name: Combined frozen-core plus lazy App Volume runtime
        shell: powershell
        run: node products/stream-deck-ultimate-bundle/experiments/per-app-audio/v08-candidate-runtime-smoke.js "$env:PACKRAT_V08_CANDIDATE"

      - name: Seeded v0.7.1 to v0.8 upgrade regression
        shell: powershell
        run: node products/stream-deck-ultimate-bundle/experiments/per-app-audio/upgrade-regression-v08.js "$env:PACKRAT_V08_CANDIDATE"

      - name: Verify Windows-staged v0.8 contract and helper
        shell: powershell
        run: |
          $manifest = Get-Content -LiteralPath (Join-Path $env:PACKRAT_V08_CANDIDATE 'manifest.json') -Raw | ConvertFrom-Json
          $info = Get-Content -LiteralPath (Join-Path $env:PACKRAT_V08_CANDIDATE 'V08_CANDIDATE_INFO.json') -Raw | ConvertFrom-Json
          $dll = Join-Path $env:PACKRAT_V08_CANDIDATE 'bin\app-audio\PackRatAppAudio.dll'
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $dll).Hash.ToLowerInvariant()
          if ($manifest.Version -ne '0.8.0.0' -or $manifest.CodePath -ne 'bin/plugin-v08.cjs') { throw 'Candidate manifest is not the expected v0.8 runtime' }
          if (@($manifest.Actions | Where-Object { $_.UUID -eq 'com.packrat.stream-deck-ultimate-bundle.app-audio' }).Count -ne 1) { throw 'Expected exactly one App Volume action' }
          if ($sha -ne $info.helperSha256 -or $sha -ne $env:PACKRAT_V08_DLL_SHA) { throw 'v0.8 packaged helper integrity verification failed' }
          if (-not $info.lazyWorker) { throw 'v0.8 candidate must keep App Volume worker lazy' }
          Write-Host "Windows v0.8 runtime contract verified: actions=$($manifest.Actions.Count) helper=$sha lazyWorker=$($info.lazyWorker)"

      - uses: actions/upload-artifact@v4
        with:
          name: stream-deck-ultimate-v08-windows-stage
          path: |
            products/stream-deck-ultimate-bundle/experiments/per-app-audio/v08-candidate-dist/com.packrat.stream-deck-ultimate-bundle.sdPlugin/**
            !products/stream-deck-ultimate-bundle/experiments/per-app-audio/v08-candidate-dist/com.packrat.stream-deck-ultimate-bundle.sdPlugin/node_modules/**
          if-no-files-found: error

  validate-pack-v08:
    needs: windows-v08-prepromotion
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: read
    env:
      PACKRAT_V08_CANDIDATE: products/stream-deck-ultimate-bundle/experiments/per-app-audio/v08-release-stage/com.packrat.stream-deck-ultimate-bundle.sdPlugin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/download-artifact@v4
        with:
          name: stream-deck-ultimate-v08-windows-stage
          path: ${{ env.PACKRAT_V08_CANDIDATE }}

      - name: Generate proven v0.7.1 release art and profiles in staged v0.8
        run: |
          python -m pip install -r products/stream-deck-ultimate-bundle/prototype/requirements.txt
          python products/stream-deck-ultimate-bundle/prototype/tools/generate_prototype_assets_v71.py "$PACKRAT_V08_CANDIDATE"
          python products/stream-deck-ultimate-bundle/prototype/tools/polish_context_art_v7.py "$PACKRAT_V08_CANDIDATE"

      - name: Verify release-stage identity, assets, profiles, and helper
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p=Path(os.environ['PACKRAT_V08_CANDIDATE'])
          m=json.loads((p/'manifest.json').read_text())
          info=json.loads((p/'V08_CANDIDATE_INFO.json').read_text())
          assert m['UUID']=='com.packrat.stream-deck-ultimate-bundle'
          assert m['Version']=='0.8.0.0'
          assert m['CodePath']=='bin/plugin-v08.cjs'
          app=[a for a in m['Actions'] if a['UUID']=='com.packrat.stream-deck-ultimate-bundle.app-audio']
          assert len(app)==1
          assert app[0]['PropertyInspectorPath']=='ui/property-inspector-app-volume.html'
          profiles=list((p/'profiles').glob('*.streamDeckProfile'))
          assert len(profiles)==8, len(profiles)
          required=[
            'imgs/actions/smart-app/icon.png','imgs/actions/smart-app/icon@2x.png',
            'imgs/actions/context/icon.png','imgs/actions/context/icon@2x.png',
            'imgs/actions/audio/icon.png','imgs/actions/audio/icon@2x.png',
            'imgs/actions/audio/key.png','imgs/actions/audio/key@2x.png',
            'imgs/plugin/category.png','imgs/plugin/category@2x.png',
            'imgs/plugin/marketplace.png','imgs/plugin/marketplace@2x.png'
          ]
          missing=[x for x in required if not (p/x).is_file()]
          assert not missing, missing
          dll=p/'bin/app-audio/PackRatAppAudio.dll'
          sha=hashlib.sha256(dll.read_bytes()).hexdigest()
          assert sha==info['helperSha256']
          assert info['lazyWorker'] is True
          assert not list(p.rglob('*.cs'))
          print(f'release-stage v0.8 verified: actions={len(m["Actions"])} profiles={len(profiles)} helper={sha}')
          PY
          git diff --exit-code -- products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin

      - name: Install locked staged runtime dependency
        working-directory: ${{ env.PACKRAT_V08_CANDIDATE }}
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Staged JavaScript syntax
        run: |
          node --check "$PACKRAT_V08_CANDIDATE/bin/plugin-v08.cjs"
          node --check "$PACKRAT_V08_CANDIDATE/bin/lib-v08-app-audio.js"
          node --check "$PACKRAT_V08_CANDIDATE/bin/app-audio/runtime-factory.js"
          node --check "$PACKRAT_V08_CANDIDATE/bin/app-audio/streamdeck-bridge.js"
          node --check "$PACKRAT_V08_CANDIDATE/bin/app-audio/worker-client.js"

      - name: Install Elgato Stream Deck CLI
        run: npm install -g @elgato/cli@1.9.0

      - name: Officially validate v0.8 candidate
        run: streamdeck validate "$PACKRAT_V08_CANDIDATE" --force-update-check

      - name: Officially pack v0.8 prepromotion candidate
        run: |
          mkdir -p products/stream-deck-ultimate-bundle/experiments/per-app-audio/v08-release-stage/packed
          streamdeck pack "$PACKRAT_V08_CANDIDATE" --output products/stream-deck-ultimate-bundle/experiments/per-app-audio/v08-release-stage/packed --force --no-file-list
          test $(find products/stream-deck-ultimate-bundle/experiments/per-app-audio/v08-release-stage/packed -name '*.streamDeckPlugin' | wc -l) -eq 1

      - uses: actions/upload-artifact@v4
        with:
          name: stream-deck-ultimate-v0.8-prepromotion-candidate
          path: |
            products/stream-deck-ultimate-bundle/experiments/per-app-audio/v08-release-stage/packed/*.streamDeckPlugin
            products/stream-deck-ultimate-bundle/experiments/per-app-audio/v08-release-stage/com.packrat.stream-deck-ultimate-bundle.sdPlugin/V08_CANDIDATE_INFO.json
          if-no-files-found: error
