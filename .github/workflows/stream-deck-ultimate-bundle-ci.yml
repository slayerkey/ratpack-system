name: Stream Deck Ultimate Bundle CI

on:
  push:
    branches:
      - product/stream-deck-ultimate-bundle
    paths:
      - 'products/stream-deck-ultimate-bundle/**'
      - '!products/stream-deck-ultimate-bundle/experiments/**'
      - '.github/workflows/stream-deck-ultimate-bundle-ci.yml'
  workflow_dispatch:

jobs:
  windows-runtime-smoke:
    runs-on: windows-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install locked plugin runtime dependency
        working-directory: products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: v0.6 proven product logic regression test
        run: node products/stream-deck-ultimate-bundle/prototype/tools/v06_product_logic_test.js products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin

      - name: v0.7 Smart Context pure logic test
        run: node products/stream-deck-ultimate-bundle/prototype/tools/context_logic_test_v7.js products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin

      - name: v0.7.1 diagnostics privacy logic test
        run: node products/stream-deck-ultimate-bundle/prototype/tools/diagnostics_logic_test_v71.js products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin

      - name: Proven core through current manifest CodePath
        run: node products/stream-deck-ultimate-bundle/prototype/tools/runtime_smoke_test_v6.js products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin

      - name: Smart Context through current multiplexed runtime
        run: node products/stream-deck-ultimate-bundle/prototype/tools/context_smoke_test_v7.js products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin

      - name: Privacy-safe diagnostics through current multiplexed runtime
        run: node products/stream-deck-ultimate-bundle/prototype/tools/diagnostics_smoke_test_v71.js products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin

      - name: PowerShell helper parses
        shell: pwsh
        run: |
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin/bin/audio.ps1'),
            [ref]$null,
            [ref]$null
          )
          Write-Host 'audio helper syntax parsed'

  validate-and-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Generate v0.7.1 branded art, profiles, diagnostics, and previews
        working-directory: products/stream-deck-ultimate-bundle/prototype
        run: |
          python -m pip install -r requirements.txt
          python tools/generate_prototype_assets_v71.py com.packrat.stream-deck-ultimate-bundle.sdPlugin
          python tools/polish_context_art_v7.py com.packrat.stream-deck-ultimate-bundle.sdPlugin

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install locked plugin runtime dependency
        working-directory: products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: JavaScript and Python syntax checks
        run: |
          node --check products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin/bin/plugin-v06.js
          node --check products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin/bin/plugin-v07.cjs
          node --check products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin/bin/plugin-v071.cjs
          node --check products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin/bin/lib-v06-config.js
          node --check products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin/bin/lib-v06-system.js
          node --check products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin/bin/lib-v06-workspace.js
          node --check products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin/bin/lib-v07-context.js
          node --check products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin/bin/lib-v071-diagnostics.js
          node --check products/stream-deck-ultimate-bundle/prototype/tools/runtime_smoke_test_v6.js
          node --check products/stream-deck-ultimate-bundle/prototype/tools/v06_product_logic_test.js
          node --check products/stream-deck-ultimate-bundle/prototype/tools/context_logic_test_v7.js
          node --check products/stream-deck-ultimate-bundle/prototype/tools/context_smoke_test_v7.js
          node --check products/stream-deck-ultimate-bundle/prototype/tools/diagnostics_logic_test_v71.js
          node --check products/stream-deck-ultimate-bundle/prototype/tools/diagnostics_smoke_test_v71.js
          python -m py_compile products/stream-deck-ultimate-bundle/prototype/tools/generate_prototype_assets_v7.py
          python -m py_compile products/stream-deck-ultimate-bundle/prototype/tools/generate_prototype_assets_v71.py
          python -m py_compile products/stream-deck-ultimate-bundle/prototype/tools/polish_context_art_v7.py

      - name: Proven v0.6 product logic regression test
        run: node products/stream-deck-ultimate-bundle/prototype/tools/v06_product_logic_test.js products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin

      - name: v0.7 Smart Context pure logic test
        run: node products/stream-deck-ultimate-bundle/prototype/tools/context_logic_test_v7.js products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin

      - name: v0.7.1 diagnostics privacy logic test
        run: node products/stream-deck-ultimate-bundle/prototype/tools/diagnostics_logic_test_v71.js products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin

      - name: Proven core through current manifest CodePath
        env:
          PACKRAT_AUDIO_MOCK: '1'
        run: node products/stream-deck-ultimate-bundle/prototype/tools/runtime_smoke_test_v6.js products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin

      - name: Smart Context through current multiplexed runtime
        env:
          PACKRAT_AUDIO_MOCK: '1'
          PACKRAT_CONTEXT_MOCK: '1'
          PACKRAT_CONTEXT_PROCESS: 'chrome'
        run: node products/stream-deck-ultimate-bundle/prototype/tools/context_smoke_test_v7.js products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin

      - name: Privacy-safe diagnostics through current multiplexed runtime
        env:
          PACKRAT_AUDIO_MOCK: '1'
          PACKRAT_CONTEXT_MOCK: '1'
          PACKRAT_DIAGNOSTICS_MOCK: '1'
        run: node products/stream-deck-ultimate-bundle/prototype/tools/diagnostics_smoke_test_v71.js products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin

      - name: Verify complete v0.7.1 profile, brand, and support bundle
        run: |
          test $(find products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin/profiles -name '*.streamDeckProfile' | wc -l) -eq 8
          test $(find products/stream-deck-ultimate-bundle/prototype/previews -name '*.png' | wc -l) -eq 8
          test -f 'products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin/profiles/Stream Deck Ultimate - Smart.streamDeckProfile'
          test -f 'products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin/profiles/Stream Deck Ultimate - Plus.streamDeckProfile'
          test -f 'products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin/profiles/Stream Deck Ultimate - XL.streamDeckProfile'
          test -f 'products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin/profiles/Stream Deck Ultimate - Neo.streamDeckProfile'
          test -f 'products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin/imgs/keys/setup-needed.png'
          test -f 'products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin/imgs/keys/ctx-back.png'
          test -f 'products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin/imgs/keys/ctx-command.png'
          test -f 'products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin/imgs/keys/web-active.png'
          test -f 'products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin/imgs/actions/context/icon.png'
          test -f 'products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin/imgs/actions/diagnostics/icon.png'
          test -f 'products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin/imgs/keys/diagnostics.png'
          test -f 'products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin/imgs/plugin/category.png'
          test -f 'products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin/imgs/plugin/marketplace.png'
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin/imgs/plugin')
          assert Image.open(p/'category.png').size == (28,28)
          assert Image.open(p/'category@2x.png').size == (56,56)
          assert Image.open(p/'marketplace.png').size == (256,256)
          assert Image.open(p/'marketplace@2x.png').size == (512,512)
          im=Image.open(p/'marketplace.png').convert('RGBA')
          green=sum(1 for px in im.getdata() if px[1] > 180 and px[0] < 100)
          white=sum(1 for px in im.getdata() if px[0] > 220 and px[1] > 220 and px[2] > 220)
          assert green > 300 and white > 1000
          print('PackRat brand mark dimensions and accent/silhouette coverage verified')
          PY

      - name: Install current Elgato Stream Deck CLI
        run: npm install -g @elgato/cli@1.9.0

      - name: Validate plugin
        run: streamdeck validate products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin --force-update-check

      - name: Pack installable plugin
        run: |
          mkdir -p products/stream-deck-ultimate-bundle/prototype/dist
          streamdeck pack products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin --output products/stream-deck-ultimate-bundle/prototype/dist --force --no-file-list

      - uses: actions/upload-artifact@v4
        with:
          name: stream-deck-ultimate-bundle-v0.7.1-support-beta
          path: |
            products/stream-deck-ultimate-bundle/prototype/dist/*.streamDeckPlugin
            products/stream-deck-ultimate-bundle/prototype/previews/*.png
            products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin/profiles/*.streamDeckProfile
            products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin/imgs/plugin/marketplace.png
            products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin/imgs/plugin/category@2x.png
            products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin/imgs/keys/diagnostics@2x.png
          if-no-files-found: error
