name: Stream Deck Ultimate Bundle CI

on:
  push:
    branches:
      - product/stream-deck-ultimate-bundle
    paths:
      - 'products/stream-deck-ultimate-bundle/**'
      - '.github/workflows/stream-deck-ultimate-bundle-ci.yml'
  workflow_dispatch:

jobs:
  windows-runtime-smoke:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install plugin runtime dependency
        working-directory: products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Runtime WebSocket smoke test
        run: node products/stream-deck-ultimate-bundle/prototype/tools/runtime_smoke_test.js products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin

  validate-and-pack:
    needs: windows-runtime-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Generate premium icons and validated V2 profile
        working-directory: products/stream-deck-ultimate-bundle/prototype
        run: |
          python -m pip install -r requirements.txt
          python tools/generate_prototype_assets_v2.py com.packrat.stream-deck-ultimate-bundle.sdPlugin

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install plugin runtime dependency
        working-directory: products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund

      - name: JavaScript syntax checks
        run: |
          node --check products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin/bin/plugin.js
          node --check products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin/bin/plugin.cjs
          node --check products/stream-deck-ultimate-bundle/prototype/tools/runtime_smoke_test.js

      - name: Runtime WebSocket smoke test
        run: node products/stream-deck-ultimate-bundle/prototype/tools/runtime_smoke_test.js products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin

      - name: Install current Elgato Stream Deck CLI
        run: npm install -g @elgato/cli@1.9.0

      - name: Validate plugin
        run: streamdeck validate products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin --force-update-check

      - name: Pack installable plugin
        run: |
          mkdir -p products/stream-deck-ultimate-bundle/prototype/dist
          streamdeck pack products/stream-deck-ultimate-bundle/prototype/com.packrat.stream-deck-ultimate-bundle.sdPlugin --output products/stream-deck-ultimate-bundle/prototype/dist --force --no-file-list

      - uses: actions/upload-artifact@v4
        with:
          name: stream-deck-ultimate-bundle-v0.2-test
          path: products/stream-deck-ultimate-bundle/prototype/dist/*.streamDeckPlugin
          if-no-files-found: error
