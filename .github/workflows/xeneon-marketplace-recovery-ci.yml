name: XENEON Marketplace Recovery CI

on:
  push:
    branches:
      - recovery/xeneon-marketplace-20260825
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.slug }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        slug:
          - now-playing
          - helldivers
          - rig-battery
          - obs-dashboard
          - agenda-panel
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate shipping HTML
        shell: pwsh
        run: python tools/xeneon/inline.py "${{ matrix.slug }}"

      - name: Verify generated HTML is deterministic
        shell: pwsh
        run: python tools/xeneon/inline.py "${{ matrix.slug }}" --check

      - name: Validate with official CORSAIR CLI
        shell: pwsh
        run: npx --yes icuewidget-cli@0.4.47 validate "widgets/${{ matrix.slug }}"

      - name: Package with official CORSAIR CLI
        shell: pwsh
        run: npx --yes icuewidget-cli@0.4.47 package "widgets/${{ matrix.slug }}"

      - name: Collect exact package and generated source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts/${{ matrix.slug }}" | Out-Null
          $pkg = Get-ChildItem -Path widgets -Filter *.icuewidget -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $pkg) { throw 'Official package command did not produce an .icuewidget archive.' }
          Copy-Item $pkg.FullName "artifacts/${{ matrix.slug }}/${{ matrix.slug }}.icuewidget"
          Copy-Item "widgets/${{ matrix.slug }}/index.html" "artifacts/${{ matrix.slug }}/index.html"
          Copy-Item "widgets/${{ matrix.slug }}/manifest.json" "artifacts/${{ matrix.slug }}/manifest.json"

      - name: Upload official recovery package
        uses: actions/upload-artifact@v4
        with:
          name: recovery-${{ matrix.slug }}
          path: artifacts/${{ matrix.slug }}/
          if-no-files-found: error
          retention-days: 30

  smoke:
    name: Packaged regression ${{ matrix.slug }}
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slug:
          - now-playing
          - helldivers
          - rig-battery
          - obs-dashboard
          - agenda-panel
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download exact official package
        uses: actions/download-artifact@v4
        with:
          name: recovery-${{ matrix.slug }}
          path: artifacts/input

      - name: Install browser regression dependencies
        run: |
          npm install --no-save playwright@1.62.1 ws@8.21.3
          npx playwright install --with-deps chromium

      - name: Extract exact package
        shell: bash
        run: |
          rm -rf artifacts/package
          mkdir -p artifacts/package
          python - <<'PY'
          import pathlib, zipfile
          slug = "${{ matrix.slug }}"
          package = pathlib.Path("artifacts/input") / f"{slug}.icuewidget"
          with zipfile.ZipFile(package) as archive:
              archive.extractall("artifacts/package")
          entry = pathlib.Path("artifacts/package/index.html")
          if not entry.exists():
              raise SystemExit(f"packaged widget is missing {entry}")
          PY

      - name: Native Custom Style after-load regression
        run: node tools/xeneon/native-style-smoke.mjs artifacts/package/index.html "artifacts/native-style-${{ matrix.slug }}"

      - name: Product-local verification when present
        shell: bash
        run: |
          verify="widgets/_src/${{ matrix.slug }}/verify.mjs"
          if [[ -f "$verify" ]]; then
            RATPACK_PACKAGED_ENTRY="$PWD/artifacts/package/index.html" node "$verify"
          else
            echo "No optional verify.mjs for ${{ matrix.slug }}"
          fi

      - name: Marketplace network regression when present
        shell: bash
        run: |
          smoke="widgets/_src/${{ matrix.slug }}/marketplace-network-smoke.mjs"
          if [[ ! -f "$smoke" ]]; then
            smoke="widgets/_src/${{ matrix.slug }}/network-smoke.mjs"
          fi
          if [[ -f "$smoke" ]]; then
            node "$smoke" artifacts/package/index.html "artifacts/network-${{ matrix.slug }}"
          else
            echo "No network regression required for ${{ matrix.slug }}"
          fi

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-evidence-${{ matrix.slug }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

  audits:
    name: Systemic XENEON audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native style inventory
        run: python tools/xeneon/native_style_audit.py artifacts/native-style-audit.json
      - name: Network inventory
        run: python tools/xeneon/network_audit.py artifacts/network-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-systemic-audits
          path: artifacts/
          retention-days: 30
