name: XENEON Missed Rejection Recovery

on:
  push:
    branches:
      - main
      - 'recovery/**'
    paths:
      - 'tools/xeneon/inline.py'
      - 'tools/xeneon/native-style-smoke.mjs'
      - 'tools/xeneon/icue-runner-smoke.mjs'
      - 'tools/xeneon/snake-settings-smoke.mjs'
      - 'tools/xeneon/net-dashboard-review-demo.mjs'
      - 'widgets/_src/snake/**'
      - 'widgets/_src/net-dashboard/**'
      - 'widgets/_src/pc-power-meter-pro/**'
      - 'widgets/_shared/pc-power-meter/**'
      - '.github/workflows/xeneon-missed-rejections-recovery.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/xeneon/inline.py'
      - 'tools/xeneon/native-style-smoke.mjs'
      - 'tools/xeneon/icue-runner-smoke.mjs'
      - 'tools/xeneon/snake-settings-smoke.mjs'
      - 'tools/xeneon/net-dashboard-review-demo.mjs'
      - 'widgets/_src/snake/**'
      - 'widgets/_src/net-dashboard/**'
      - 'widgets/_src/pc-power-meter-pro/**'
      - 'widgets/_shared/pc-power-meter/**'
      - '.github/workflows/xeneon-missed-rejections-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    name: Exact packages plus reviewer evidence
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate, validate, package, and extract all three products
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/packages | Out-Null
          New-Item -ItemType Directory -Force -Path artifacts/extracted | Out-Null
          $slugs = @('snake', 'net-dashboard', 'pc-power-meter-pro')
          foreach ($slug in $slugs) {
            Get-ChildItem -Path widgets -Filter *.icuewidget -File -ErrorAction SilentlyContinue | Remove-Item -Force
            python tools/xeneon/inline.py $slug
            if ($LASTEXITCODE -ne 0) { throw "inline generation failed for $slug" }
            python tools/xeneon/inline.py $slug --check
            if ($LASTEXITCODE -ne 0) { throw "deterministic generation check failed for $slug" }
            npx --yes icuewidget-cli@0.4.47 validate "widgets/$slug"
            if ($LASTEXITCODE -ne 0) { throw "official validation failed for $slug" }
            npx --yes icuewidget-cli@0.4.47 package "widgets/$slug"
            if ($LASTEXITCODE -ne 0) { throw "official packaging failed for $slug" }
            $pkg = Get-ChildItem -Path widgets -Filter *.icuewidget -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if (-not $pkg) { throw "official package was not created for $slug" }
            Copy-Item $pkg.FullName "artifacts/packages/$slug.icuewidget"
            New-Item -ItemType Directory -Force -Path "artifacts/extracted/$slug" | Out-Null
          }
          @'
          import pathlib, zipfile
          root = pathlib.Path('artifacts')
          for slug in ('snake', 'net-dashboard', 'pc-power-meter-pro'):
              package = root / 'packages' / f'{slug}.icuewidget'
              out = root / 'extracted' / slug
              if not zipfile.is_zipfile(package):
                  raise SystemExit(f'{slug}: package is not ZIP-compatible')
              with zipfile.ZipFile(package) as archive:
                  bad = archive.testzip()
                  if bad:
                      raise SystemExit(f'{slug}: corrupt package member: {bad}')
                  archive.extractall(out)
              for required in ('index.html', 'manifest.json'):
                  if not (out / required).is_file():
                      raise SystemExit(f'{slug}: package missing root {required}')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'exact package integrity check failed' }

      - name: Verify revision version remains Version 1
        shell: pwsh
        run: |
          @'
          import json, pathlib
          for slug in ('snake', 'net-dashboard', 'pc-power-meter-pro'):
              submission = json.loads((pathlib.Path('widgets/_src') / slug / 'submission.json').read_text(encoding='utf-8'))
              version = str(submission.get('version', ''))
              if version != '1.0.0':
                  raise SystemExit(f'{slug}: revision must remain 1.0.0, found {version!r}')
              manifest = json.loads((pathlib.Path('artifacts/extracted') / slug / 'manifest.json').read_text(encoding='utf-8'))
              manifest_version = str(manifest.get('version', manifest.get('Version', '')))
              if manifest_version and manifest_version not in ('1', '1.0', '1.0.0'):
                  raise SystemExit(f'{slug}: packaged manifest changed version: {manifest_version!r}')
          '@ | python -

      - name: Install Playwright
        shell: pwsh
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install chromium

      - name: Prove Snake theme control updates exact package
        shell: pwsh
        run: node tools/xeneon/snake-settings-smoke.mjs artifacts/extracted/snake/index.html artifacts/snake-settings

      - name: Prove Network Dashboard Custom Style with lexical bindings
        shell: pwsh
        run: node tools/xeneon/native-style-smoke.mjs artifacts/extracted/net-dashboard/index.html artifacts/native-style/net-dashboard

      - name: Prove PC Power Meter Pro Custom Style with lexical bindings
        shell: pwsh
        run: node tools/xeneon/native-style-smoke.mjs artifacts/extracted/pc-power-meter-pro/index.html artifacts/native-style/pc-power-meter-pro

      - name: Clone Corsair Labs iCUE Widget Runner
        shell: pwsh
        run: |
          $runnerDir = Join-Path $env:RUNNER_TEMP 'icue-widget-runner-windows'
          if (Test-Path $runnerDir) { Remove-Item -Recurse -Force $runnerDir }
          git clone --depth 1 https://github.com/Corsair-Labs/iCUE-widget-runner-windows.git $runnerDir
          git -C $runnerDir rev-parse HEAD | Set-Content artifacts/corsair-runner-commit.txt
          foreach ($slug in @('snake', 'net-dashboard', 'pc-power-meter-pro')) {
            $target = Join-Path (Join-Path $runnerDir 'widgets') $slug
            if (Test-Path $target) { Remove-Item -Recurse -Force $target }
            Copy-Item -Recurse -Force "artifacts/extracted/$slug" $target
          }

      - name: Corsair Labs exact-package host and settings smoke
        shell: pwsh
        run: |
          $runnerDir = Join-Path $env:RUNNER_TEMP 'icue-widget-runner-windows'
          $stdout = Join-Path $env:RUNNER_TEMP 'corsair-runner-missed-rejections.out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'corsair-runner-missed-rejections.err.log'
          $process = Start-Process node -ArgumentList 'web-server.js' -WorkingDirectory $runnerDir -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8080/api/widgets -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'Corsair Labs runner did not become ready.' }
            foreach ($slug in @('snake', 'net-dashboard', 'pc-power-meter-pro')) {
              node tools/xeneon/icue-runner-smoke.mjs http://127.0.0.1:8080/ $slug "artifacts/icue-runner/$slug"
              if ($LASTEXITCODE -ne 0) { throw "Corsair Labs runner smoke failed for $slug" }
            }
          }
          finally {
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            if (Test-Path $stdout) { Copy-Item $stdout artifacts/corsair-runner.stdout.log }
            if (Test-Path $stderr) { Copy-Item $stderr artifacts/corsair-runner.stderr.log }
          }

      - name: Record Network Dashboard reviewer demo
        shell: pwsh
        run: node tools/xeneon/net-dashboard-review-demo.mjs artifacts/extracted/net-dashboard/index.html artifacts/net-dashboard-review-demo

      - name: Convert Network Dashboard demo to MP4 when FFmpeg is available
        shell: pwsh
        run: |
          $ffmpeg = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if (-not $ffmpeg) {
            Write-Host 'FFmpeg not available on this runner; preserving WebM recording.'
            exit 0
          }
          ffmpeg -y -i artifacts/net-dashboard-review-demo/net-dashboard-review-demo.webm -c:v libx264 -pix_fmt yuv420p -movflags +faststart -an artifacts/net-dashboard-review-demo/net-dashboard-review-demo.mp4

      - name: Write resubmission checklist and hashes
        shell: pwsh
        run: |
          @'
          XENEON MISSED REJECTIONS RESUBMISSION

          Snake
          Upload: packages/snake.icuewidget
          Keep Marketplace revision at Version 1.
          Reviewer complaint: color customization did not work.
          Evidence: snake-settings/snake-settings-result.json proves the exact package changes Theme from Matrix to Ember through lexical iCUE bindings and onDataUpdated.

          Network Dashboard
          Upload: packages/net-dashboard.icuewidget
          Keep Marketplace revision at Version 1.
          Reviewer complaints: Custom Style did not work and functionality could not be verified.
          Evidence: native-style/net-dashboard proves Custom Style through lexical iCUE bindings. Send net-dashboard-review-demo/net-dashboard-review-demo.mp4 when present, otherwise the WebM.
          Disclosure for email: This demo uses deterministic HTTPS probe and throughput fixtures with the exact packaged widget. It demonstrates widget logic and interaction but is not represented as a live network measurement.

          PC Power Meter Pro
          Upload: packages/pc-power-meter-pro.icuewidget
          Keep Marketplace revision at Version 1.
          Reviewer complaint: unsupported or corrupted during installation.
          This is a freshly generated official CORSAIR package that passed ZIP integrity, root file checks, official validation, lexical settings regression, and Corsair Labs host loading.

          Do not reuse any of the originally rejected package files.
          '@ | Set-Content -Encoding UTF8 artifacts/RESUBMISSION-CHECKLIST.txt
          Get-ChildItem artifacts/packages/*.icuewidget | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ASCII artifacts/SHA256SUMS.txt

      - name: Upload complete second-batch resubmission evidence
        uses: actions/upload-artifact@v4
        with:
          name: xeneon-missed-rejections-resubmission
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
