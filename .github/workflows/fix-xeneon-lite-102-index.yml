name: Fix XENEON Lite 1.0.2 Index

on:
  push:
    branches:
      - fix/xeneon-lite-102-2026-09-01
    paths:
      - .github/workflows/fix-xeneon-lite-102-index.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/xeneon-lite-102-2026-09-01
          fetch-depth: 0
      - name: Reconcile canonical versions
        run: |
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path('.')
          p = root / 'products/index.json'
          text = p.read_text(encoding='utf-8')
          replacements = {
            '{"id":"work-session-tracker","name":"Work Session Tracker Lite","type":"widget","status":"published","price_usd":0.0,"version":"1.0.1"}': '{"id":"work-session-tracker","name":"Work Session Tracker Lite","type":"widget","status":"published","price_usd":0.0,"version":"1.0.2"}',
            '{"id":"pc-power-meter","name":"PC Power Meter Lite","type":"widget","status":"published","price_usd":0.0,"version":"1.0.1"}': '{"id":"pc-power-meter","name":"PC Power Meter Lite","type":"widget","status":"published","price_usd":0.0,"version":"1.0.2"}',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
              elif new not in text:
                  raise SystemExit('Expected canonical product record not found: ' + old)
          p.write_text(text, encoding='utf-8')

          for slug in ('work-session-tracker','pc-power-meter'):
              manifest = json.loads((root/'widgets'/slug/'manifest.json').read_text(encoding='utf-8'))
              submission = json.loads((root/'widgets'/'_src'/slug/'submission.json').read_text(encoding='utf-8'))
              assert manifest['version'] == '1.0.2', (slug, manifest['version'])
              assert submission['version'] == '1.0.2', (slug, submission['version'])
          PY
          rm .github/workflows/fix-xeneon-lite-102-index.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add products/index.json .github/workflows/fix-xeneon-lite-102-index.yml
          git commit -m "Reconcile XENEON Lite 1.0.2 catalog versions"
          git push origin HEAD:fix/xeneon-lite-102-2026-09-01
