name: CS2 Competitive Dashboard Rat Art

on:
  push:
    branches:
      - product/cs2-competitive-dashboard
    paths:
      - 'products/cs2-competitive-dashboard/art/**'
      - 'tools/art/rat_art.py'
      - 'tools/art/assets/ratpack-icon-transparent.png'
      - '.github/workflows/cs2-dashboard-art.yml'
  pull_request:
    branches: [main]
    paths:
      - 'products/cs2-competitive-dashboard/art/**'
      - 'tools/art/rat_art.py'
      - 'tools/art/assets/ratpack-icon-transparent.png'
      - '.github/workflows/cs2-dashboard-art.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install deterministic renderer dependency
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Render candidate art
        run: python products/cs2-competitive-dashboard/art/render.py

      - name: Validate marketplace dimensions and uniqueness
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib

          root = Path('products/cs2-competitive-dashboard/art/out')
          expected = {
              '0-app-icon-288.png': (288, 288),
              '1-hero.png': (1920, 960),
              '2-features.png': (1920, 960),
              '3-setup.png': (1920, 960),
              '4-privacy.png': (1920, 960),
          }
          digests = set()
          for name, size in expected.items():
              path = root / name
              if not path.is_file():
                  raise SystemExit(f'missing {path}')
              with Image.open(path) as image:
                  if image.size != size:
                      raise SystemExit(f'{name}: expected {size}, got {image.size}')
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest in digests:
                  raise SystemExit(f'duplicate marketplace frame: {name}')
              digests.add(digest)
              print(name, size, digest)
          PY

      - name: Upload Rat Art candidate
        uses: actions/upload-artifact@v4
        with:
          name: cs2-competitive-dashboard-rat-art-candidate
          path: products/cs2-competitive-dashboard/art/out/*.png
          if-no-files-found: error
