name: PackRat Marketplace Catalog Extract

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch complete public PackRat catalog
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          (async()=>{
            let url='https://mp-gateway.elgato.com/products?organization_id=6ca8662c-1988-4901-8058-f5929450a596&limit=100&offset=0';
            const products=[];
            const seen=new Set();
            while(url){
              if(seen.has(url)) throw new Error('pagination loop');
              seen.add(url);
              const r=await fetch(url,{headers:{'accept':'application/json','user-agent':'PackRat-Marketplace-Audit/1.0'}});
              if(!r.ok) throw new Error(`HTTP ${r.status} ${url}`);
              const d=await r.json();
              products.push(...(d.results||[]));
              url=d.next||null;
            }
            const rows=products.map(p=>({
              id:p.id,name:p.name,slug:p.slug,org_name:p.org_name,org_slug:p.org_slug,
              extension:p.extension,application:p.application,last_published:p.last_published,
              download_count:p.download_count,
              free:!!(p.variants||[]).find(v=>v.is_default)?.is_free,
              price:(p.variants||[]).find(v=>v.is_default)?.price?.unit_amount ?? null,
              url:'https://marketplace.elgato.com/product/'+p.slug
            }));
            rows.sort((a,b)=>a.name.localeCompare(b.name));
            fs.writeFileSync('packrat-marketplace-catalog.json',JSON.stringify({count:rows.length,products:rows},null,2));
            console.log('COUNT',rows.length);
            console.log(JSON.stringify(rows,null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: packrat-marketplace-catalog
          path: packrat-marketplace-catalog.json
          if-no-files-found: error
          retention-days: 30
