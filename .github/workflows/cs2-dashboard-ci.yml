name: CS2 Competitive Dashboard CI

on:
  push:
    branches:
      - product/cs2-competitive-dashboard
    paths:
      - 'products/cs2-competitive-dashboard/**'
      - 'products/cs2-competitive-dashboard-pro.json'
      - 'products/cs2-competitive-dashboard-lite.json'
      - '.github/workflows/cs2-dashboard-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'products/cs2-competitive-dashboard/**'
      - 'products/cs2-competitive-dashboard-pro.json'
      - 'products/cs2-competitive-dashboard-lite.json'
      - '.github/workflows/cs2-dashboard-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plugin:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: products/cs2-competitive-dashboard/plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Commit generated dependency lock
        if: github.event_name == 'push' && github.ref_name == 'product/cs2-competitive-dashboard' && github.actor != 'github-actions[bot]'
        working-directory: .
        shell: pwsh
        run: |
          if (git status --porcelain -- products/cs2-competitive-dashboard/plugin/package-lock.json) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add products/cs2-competitive-dashboard/plugin/package-lock.json
            git commit -m "build: lock CS2 dashboard dependencies"
            git push origin HEAD:product/cs2-competitive-dashboard
          } else {
            Write-Host "Dependency lock already current."
          }

      - name: Typecheck fixtures and build both flavors
        run: npm run check

      - name: Validate with Elgato CLI
        run: npm run validate

      - name: Package Pro and Lite
        run: npm run pack

      - name: Upload Stream Deck packages
        uses: actions/upload-artifact@v4
        with:
          name: cs2-competitive-dashboard-streamdeck-packages
          path: products/cs2-competitive-dashboard/plugin/dist/*.streamDeckPlugin
          if-no-files-found: error
