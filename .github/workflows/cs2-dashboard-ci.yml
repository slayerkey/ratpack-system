name: CS2 Competitive Dashboard CI

on:
  push:
    branches:
      - product/cs2-competitive-dashboard
    paths:
      - 'products/cs2-competitive-dashboard/**'
      - 'products/cs2-competitive-dashboard-pro.json'
      - 'products/cs2-competitive-dashboard-lite.json'
      - 'plugins/cs2-competitive-dashboard/**'
      - 'tools/local/rat-ship-plugin.ps1'
      - '.github/workflows/cs2-dashboard-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'products/cs2-competitive-dashboard/**'
      - 'products/cs2-competitive-dashboard-pro.json'
      - 'products/cs2-competitive-dashboard-lite.json'
      - 'plugins/cs2-competitive-dashboard/**'
      - 'tools/local/rat-ship-plugin.ps1'
      - '.github/workflows/cs2-dashboard-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: products/cs2-competitive-dashboard/plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: products/cs2-competitive-dashboard/plugin/package-lock.json

      - name: Set up Python 3.13 for Rat Art
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install deterministic Rat Art dependency
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Install locked dependencies
        run: npm ci

      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck fixtures and build both flavors
        run: npm run check

      - name: Validate with Elgato CLI
        run: npm run validate

      - name: Package Pro and Lite
        run: npm run pack

      - name: Assert final Marketplace gate fails closed before physical and Leetify evidence
        shell: pwsh
        run: |
          $output = & node scripts/final-release-gate.mjs 2>&1 | Out-String
          $exit = $LASTEXITCODE
          Write-Host $output
          if ($exit -eq 0) { throw 'Final Marketplace gate unexpectedly passed in clean CI without local physical/provider evidence or Leetify clearance.' }
          foreach ($required in @(
            'Fresh matching physical Windows host evidence is present',
            'Official Leetify attribution source asset is present',
            'Leetify paid product use is explicitly cleared',
            'FINAL MARKETPLACE GATE: BLOCKED'
          )) {
            if ($output -notlike "*$required*") { throw "Fail-closed gate output missing expected blocker: $required" }
          }

      - name: Upload Stream Deck packages
        uses: actions/upload-artifact@v4
        with:
          name: cs2-competitive-dashboard-streamdeck-packages
          path: products/cs2-competitive-dashboard/plugin/dist/*.streamDeckPlugin
          if-no-files-found: error

      - name: Build exact non-public Rat Ship Pro kit
        shell: pwsh
        run: |
          $repo = (Resolve-Path '..\..\..').Path
          $helper = Join-Path $repo 'tools\local\rat-ship-plugin.ps1'
          $dest = Join-Path $repo 'out\ci-cs2-competitive-dashboard-pro-kit'
          & $helper -PluginSlug 'cs2-competitive-dashboard-pro' -Destination $dest
          if ($LASTEXITCODE -ne 0) { throw "Rat Ship helper failed with exit code $LASTEXITCODE" }
          $required = @(
            'cs2-competitive-dashboard-pro.streamDeckPlugin',
            'submission.json',
            'PASTE_description.txt',
            'PASTE_release_notes.txt',
            '01_search_icon.png',
            '02_cover.png',
            '03_gallery_01.png',
            '04_gallery_02.png',
            '05_gallery_03.png',
            '06_gallery_04.png'
          )
          foreach ($name in $required) {
            if (-not (Test-Path (Join-Path $dest $name) -PathType Leaf)) { throw "Rat Ship kit missing $name" }
          }
          $submission = Get-Content (Join-Path $dest 'submission.json') -Raw | ConvertFrom-Json
          if ($submission.slug -ne 'cs2-competitive-dashboard-pro') { throw 'Rat Ship kit submission slug mismatch' }
          if ([decimal]$submission.price_usd -ne [decimal]14.99) { throw 'Rat Ship kit price mismatch' }

      - name: Upload exact Rat Ship Pro kit
        uses: actions/upload-artifact@v4
        with:
          name: cs2-competitive-dashboard-pro-rat-ship-kit
          path: out/ci-cs2-competitive-dashboard-pro-kit/**
          if-no-files-found: error

  rat-dev-registration:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build through Rat Dev shim
        run: npm --prefix plugins/cs2-competitive-dashboard run build

      - name: Test through Rat Dev shim
        run: npm --prefix plugins/cs2-competitive-dashboard test

      - name: Verify Pro development target
        shell: pwsh
        run: |
          $config = Get-Content plugins/cs2-competitive-dashboard/rat-dev.json -Raw | ConvertFrom-Json
          if ($config.type -ne 'streamdeck-plugin') { throw 'Rat Dev type mismatch' }
          if ($config.plugin_uuid -ne 'com.packrat.cs2-competitive-dashboard-pro') { throw 'Rat Dev UUID mismatch' }
          $pluginDir = Join-Path 'plugins/cs2-competitive-dashboard' $config.plugin_dir
          if (-not (Test-Path $pluginDir)) { throw "Rat Dev plugin output missing: $pluginDir" }
          $manifest = Get-Content (Join-Path $pluginDir 'manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.UUID -ne $config.plugin_uuid) { throw 'Built Pro manifest UUID does not match Rat Dev registration' }
