name: CS2 Competitive Dashboard CI

on:
  push:
    branches:
      - product/cs2-competitive-dashboard
    paths:
      - 'products/cs2-competitive-dashboard/**'
      - 'products/cs2-competitive-dashboard-pro.json'
      - 'products/cs2-competitive-dashboard-lite.json'
      - '.github/workflows/cs2-dashboard-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'products/cs2-competitive-dashboard/**'
      - 'products/cs2-competitive-dashboard-pro.json'
      - 'products/cs2-competitive-dashboard-lite.json'
      - '.github/workflows/cs2-dashboard-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: products/cs2-competitive-dashboard/plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: products/cs2-competitive-dashboard/plugin/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck fixtures and build both flavors
        run: npm run check

      - name: Validate with Elgato CLI
        run: npm run validate

      - name: Package Pro and Lite
        run: npm run pack

      - name: Upload Stream Deck packages
        uses: actions/upload-artifact@v4
        with:
          name: cs2-competitive-dashboard-streamdeck-packages
          path: products/cs2-competitive-dashboard/plugin/dist/*.streamDeckPlugin
          if-no-files-found: error

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/cs2-competitive-dashboard/gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate stateless gateway
        run: npm run check
