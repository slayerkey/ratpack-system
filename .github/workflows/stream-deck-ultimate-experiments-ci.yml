name: Stream Deck Ultimate Experiments CI

on:
  push:
    branches:
      - product/stream-deck-ultimate-bundle
    paths:
      - 'products/stream-deck-ultimate-bundle/experiments/**'
      - '.github/workflows/stream-deck-ultimate-experiments-ci.yml'
  workflow_dispatch:

jobs:
  windows-per-app-audio:
    runs-on: windows-latest
    timeout-minutes: 14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Per-app audio product/session model
        run: node products/stream-deck-ultimate-bundle/experiments/per-app-audio/session-model.test.js

      - name: Shared cached/coalesced app-audio service
        run: node products/stream-deck-ultimate-bundle/experiments/per-app-audio/app-audio-service.test.js

      - name: Stream Deck Current App / named app surface semantics
        run: node products/stream-deck-ultimate-bundle/experiments/per-app-audio/streamdeck-surface-model.test.js

      - name: Stream Deck app-audio lifecycle controller
        run: node products/stream-deck-ultimate-bundle/experiments/per-app-audio/streamdeck-controller.test.js

      - name: JavaScript syntax checks
        run: |
          node --check products/stream-deck-ultimate-bundle/experiments/per-app-audio/session-model.js
          node --check products/stream-deck-ultimate-bundle/experiments/per-app-audio/session-model.test.js
          node --check products/stream-deck-ultimate-bundle/experiments/per-app-audio/app-audio-service.js
          node --check products/stream-deck-ultimate-bundle/experiments/per-app-audio/app-audio-service.test.js
          node --check products/stream-deck-ultimate-bundle/experiments/per-app-audio/streamdeck-surface-model.js
          node --check products/stream-deck-ultimate-bundle/experiments/per-app-audio/streamdeck-surface-model.test.js
          node --check products/stream-deck-ultimate-bundle/experiments/per-app-audio/streamdeck-controller.js
          node --check products/stream-deck-ultimate-bundle/experiments/per-app-audio/streamdeck-controller.test.js
          node --check products/stream-deck-ultimate-bundle/experiments/per-app-audio/worker-client.js
          node --check products/stream-deck-ultimate-bundle/experiments/per-app-audio/worker-client.test.js
          node --check products/stream-deck-ultimate-bundle/experiments/per-app-audio/worker-native-start.test.js
          node --check products/stream-deck-ultimate-bundle/experiments/per-app-audio/worker-precompiled-start.test.js

      - name: Parse experimental PowerShell wrappers and real-host harness
        shell: powershell
        run: |
          foreach ($file in @(
            'products/stream-deck-ultimate-bundle/experiments/per-app-audio/app-audio.ps1',
            'products/stream-deck-ultimate-bundle/experiments/per-app-audio/app-audio-worker.ps1',
            'products/stream-deck-ultimate-bundle/experiments/per-app-audio/build-helper.ps1',
            'products/stream-deck-ultimate-bundle/experiments/per-app-audio/prepare-host-bundle.ps1',
            'products/stream-deck-ultimate-bundle/experiments/per-app-audio/real-host-smoke.ps1'
          )) {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }
          Write-Host 'per-app audio PowerShell syntax parsed'

      - name: Persistent mock worker protocol and behavior
        run: node products/stream-deck-ultimate-bundle/experiments/per-app-audio/worker-client.test.js

      - name: Persistent native worker source fallback loads real Core Audio interop
        run: node products/stream-deck-ultimate-bundle/experiments/per-app-audio/worker-native-start.test.js

      - name: Build precompiled Core Audio helper assembly
        shell: powershell
        run: |
          $json = & 'products/stream-deck-ultimate-bundle/experiments/per-app-audio/build-helper.ps1'
          if ($LASTEXITCODE -ne 0) { throw "Helper build exited $LASTEXITCODE" }
          $build = $json | ConvertFrom-Json
          if (-not $build.ok) { throw 'Precompiled helper build did not report ok' }
          if (-not (Test-Path -LiteralPath $build.path)) { throw "Precompiled helper missing: $($build.path)" }
          if ($build.type -ne 'PackRatAppAudio.Core') { throw "Unexpected helper type: $($build.type)" }
          if ([string]::IsNullOrWhiteSpace([string]$build.sha256)) { throw 'Precompiled helper missing SHA256' }
          "PACKRAT_APP_AUDIO_DLL=$($build.path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "precompiled helper built: $($build.sizeBytes) bytes sha256=$($build.sha256)"

      - name: Persistent worker starts from precompiled helper without runtime C# compilation
        run: node products/stream-deck-ultimate-bundle/experiments/per-app-audio/worker-precompiled-start.test.js

      - name: Core Audio command wrapper loads helper
        shell: powershell
        run: |
          $result = & 'products/stream-deck-ultimate-bundle/experiments/per-app-audio/app-audio.ps1' -Action Compile
          Write-Host $result
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probe = $result | ConvertFrom-Json
          if (-not $probe.ok -or $probe.type -ne 'PackRatAppAudio.Core') { throw 'Core Audio wrapper did not load helper' }
          if ($probe.backend -ne 'assembly') { throw "Expected app-audio wrapper to prefer precompiled assembly, saw $($probe.backend)" }

      - name: Real-host harness emits structured read-only audit without requiring CI audio hardware
        shell: powershell
        run: |
          $json = & 'products/stream-deck-ultimate-bundle/experiments/per-app-audio/real-host-smoke.ps1'
          if ($LASTEXITCODE -ne 0) { throw "Read-only real-host harness exited $LASTEXITCODE" }
          $report = $json | ConvertFrom-Json
          if ($report.schema -ne 1) { throw 'Unexpected real-host report schema' }
          if ($null -eq $report.endpointAvailable) { throw 'Missing endpointAvailable field' }
          if ([string]::IsNullOrWhiteSpace([string]$report.status)) { throw 'Missing report status' }
          Write-Host "real-host audit structure passed; hosted runner status=$($report.status) endpointAvailable=$($report.endpointAvailable)"

      - name: Prepare source-free real Windows host-test bundle
        shell: powershell
        run: |
          $json = & 'products/stream-deck-ultimate-bundle/experiments/per-app-audio/prepare-host-bundle.ps1' -AssemblyPath $env:PACKRAT_APP_AUDIO_DLL
          if ($LASTEXITCODE -ne 0) { throw "Host bundle staging exited $LASTEXITCODE" }
          $bundle = $json | ConvertFrom-Json
          if (-not $bundle.ok -or $bundle.fileCount -ne 6) { throw "Unexpected host bundle result: $json" }
          if ([string]::IsNullOrWhiteSpace([string]$bundle.helperSha256)) { throw 'Host bundle missing helper hash' }
          $sourceFiles = @(Get-ChildItem -File -LiteralPath $bundle.outputDir | Where-Object { $_.Extension -eq '.cs' })
          if ($sourceFiles.Count -ne 0) { throw 'Host bundle must not contain C# source' }
          "PACKRAT_HOST_BUNDLE=$($bundle.outputDir)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "host bundle staged: $($bundle.fileCount) files helperSha256=$($bundle.helperSha256)"

      - name: Source-free host bundle boots through packaged DLL
        shell: powershell
        run: |
          $launcher = Join-Path $env:PACKRAT_HOST_BUNDLE 'run-host-test.cmd'
          $json = & $launcher
          if ($LASTEXITCODE -ne 0) { throw "Packaged host launcher exited $LASTEXITCODE" }
          $report = $json | ConvertFrom-Json
          if ($report.schema -ne 1) { throw 'Packaged host report schema mismatch' }
          if ([string]::IsNullOrWhiteSpace([string]$report.status)) { throw 'Packaged host report missing status' }
          if (Test-Path (Join-Path $env:PACKRAT_HOST_BUNDLE 'PackRatAppAudio.cs')) { throw 'Packaged host unexpectedly contains source' }
          Write-Host "source-free host bundle boot passed; status=$($report.status) endpointAvailable=$($report.endpointAvailable)"

      - name: Probe session enumeration when Windows runner exposes an audio endpoint
        shell: powershell
        continue-on-error: true
        run: |
          try {
            $result = & 'products/stream-deck-ultimate-bundle/experiments/per-app-audio/app-audio.ps1' -Action List
            Write-Host $result
          } catch {
            Write-Host "Enumeration probe unavailable on hosted runner: $($_.Exception.Message)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: stream-deck-ultimate-per-app-audio-host-test
          path: products/stream-deck-ultimate-bundle/experiments/per-app-audio/host-test-dist/*
          if-no-files-found: error
