name: Rat Ship XENEON

on:
  pull_request:
    branches: [main]
    paths:
      - 'widgets/_src/**'
      - 'widgets/**'
      - 'tools/art/**'
      - 'tools/xeneon/**'
      - 'tools/ship/**'
      - 'skills/rat-ship/**'
      - '.github/workflows/rat-ship-xeneon.yml'
  workflow_dispatch:
    inputs:
      slug:
        description: XENEON widget slug
        required: true
        default: now-playing

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve widget slug
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.slug.outputs.slug }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve one product
        id: slug
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            slug="${{ inputs.slug }}"
          else
            mapfile -t slugs < <(
              git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" |
              awk -F/ '
                /^widgets\/_src\/[^/]+\// { print $3 }
                /^widgets\/[^_][^/]*\// { print $2 }
              ' |
              sort -u
            )
            if [[ ${#slugs[@]} -ne 1 ]]; then
              echo "Expected exactly one changed widget slug, found ${#slugs[@]}: ${slugs[*]}" >&2
              echo "Use workflow_dispatch with an explicit slug for shared or multi-product work." >&2
              exit 1
            fi
            slug="${slugs[0]}"
          fi
          if [[ ! -d "widgets/_src/$slug" || ! -d "widgets/$slug" ]]; then
            echo "Widget source or shipping directory is missing for $slug" >&2
            exit 1
          fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "Resolved XENEON widget: $slug"

  ship-kit:
    needs: resolve
    runs-on: windows-latest
    env:
      WIDGET_SLUG: ${{ needs.resolve.outputs.slug }}
      RATPACK_ART_FONT: C:\Windows\Fonts\segoeui.ttf
      RATPACK_ART_FONT_BOLD: C:\Windows\Fonts\segoeuib.ttf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install deterministic ship dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==12.3.0
          npm install --no-save playwright@1.62.1
          npm audit --audit-level=high
          npx playwright install chromium

      - name: Build canonical shipping widget
        shell: pwsh
        run: python tools/xeneon/inline.py $env:WIDGET_SLUG

      - name: Official CORSAIR validation
        shell: pwsh
        run: npx --yes icuewidget-cli@0.4.47 validate "widgets/$env:WIDGET_SLUG"

      - name: Official CORSAIR package
        shell: pwsh
        run: |
          npx --yes icuewidget-cli@0.4.47 package "widgets/$env:WIDGET_SLUG"
          New-Item -ItemType Directory -Force -Path artifacts/package | Out-Null
          $pkg = Get-ChildItem -Path widgets -Filter *.icuewidget -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $pkg) { throw 'official package was not created' }
          Copy-Item $pkg.FullName "artifacts/package/$env:WIDGET_SLUG.icuewidget"

      - name: Capture real widget for Rat Art
        shell: pwsh
        run: node tools/art/capture_xeneon.mjs $env:WIDGET_SLUG "artifacts/rat-art/shots"

      - name: Render deterministic Rat Art
        shell: pwsh
        run: python tools/art/rat_art.py xeneon $env:WIDGET_SLUG --shots "artifacts/rat-art/shots" --out "artifacts/rat-art/review"

      - name: Render search icon from canonical SVG
        shell: pwsh
        run: node tools/ship/render_svg_icon.mjs "widgets/$env:WIDGET_SLUG/resources/icon.svg" "artifacts/rat-art/review/icon-288x288.png"

      - name: Build Maker Console SHIP_KIT
        shell: pwsh
        run: |
          python tools/ship/make_xeneon_kit.py $env:WIDGET_SLUG `
            --package "artifacts/package/$env:WIDGET_SLUG.icuewidget" `
            --art "artifacts/rat-art/review" `
            --out "artifacts/ship/$env:WIDGET_SLUG/SHIP_KIT"

      - name: Playwright driver kit preflight
        shell: pwsh
        run: node tools/ship/maker_console.mjs $env:WIDGET_SLUG --kit="artifacts/ship/$env:WIDGET_SLUG/SHIP_KIT" --check-kit

      - name: Rat Ship invariants
        shell: pwsh
        run: |
          $kit = "artifacts/ship/$env:WIDGET_SLUG/SHIP_KIT"
          $kitSub = Get-Content "$kit/submission.json" -Raw | ConvertFrom-Json
          $sourceSub = Get-Content "widgets/_src/$env:WIDGET_SLUG/submission.json" -Raw | ConvertFrom-Json
          $manifest = Get-Content "widgets/$env:WIDGET_SLUG/manifest.json" -Raw | ConvertFrom-Json
          if ($sourceSub.type -ne 'widget' -or $kitSub.type -ne 'widget') { throw 'submission type must be widget' }
          foreach ($field in @('slug','name','version','price_usd')) {
            if ($kitSub.$field -ne $sourceSub.$field) { throw "ship kit metadata mismatch: $field" }
          }
          if ($manifest.name -ne $sourceSub.name) { throw 'manifest and submission name mismatch' }
          if ($manifest.version -ne $sourceSub.version) { throw 'manifest and submission version mismatch' }
          if ($manifest.author -ne 'PackRat 🐀') { throw 'unexpected XENEON author string' }
          if (-not (Test-Path "$kit/$env:WIDGET_SLUG.icuewidget")) { throw 'missing official widget package' }
          foreach ($f in @('01_search_icon.png','02_cover.png','03_gallery_01.png','04_gallery_02.png','05_gallery_03.png','06_gallery_04.png')) {
            if (-not (Test-Path "$kit/$f")) { throw "missing $f" }
          }

      - name: Upload Rat Ship kit
        uses: actions/upload-artifact@v4
        with:
          name: rat-ship-${{ env.WIDGET_SLUG }}
          path: artifacts/ship/${{ env.WIDGET_SLUG }}/SHIP_KIT/
          if-no-files-found: error
          retention-days: 30
