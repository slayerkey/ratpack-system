name: XENEON Real iCUE Round 2

on:
  push:
    branches:
      - main
      - 'recovery/xeneon-real-icue-round2-*'
    paths:
      - 'widgets/_shared/weather-timeline/**'
      - 'widgets/_src/weather-timeline/**'
      - 'widgets/_src/weather-timeline-pro/**'
      - 'widgets/_shared/pc-power-meter/**'
      - 'widgets/_src/pc-power-meter/**'
      - 'widgets/_src/pc-power-meter-pro/**'
      - 'widgets/_src/desk-notes/**'
      - 'widgets/_src/desk-notes-pro/**'
      - 'widgets/desk-notes/README.txt'
      - 'widgets/desk-notes-pro/README.txt'
      - 'widgets/_src/net-dashboard/**'
      - 'tools/xeneon/native-style-autosync-smoke.mjs'
      - 'tools/xeneon/weather-device-scale-smoke.mjs'
      - 'tools/xeneon/net-dashboard-file-origin-smoke.mjs'
      - '.github/workflows/xeneon-real-icue-round2.yml'
  pull_request:
    branches: [main]
    paths:
      - 'widgets/_shared/weather-timeline/**'
      - 'widgets/_src/weather-timeline/**'
      - 'widgets/_src/weather-timeline-pro/**'
      - 'widgets/_shared/pc-power-meter/**'
      - 'widgets/_src/pc-power-meter/**'
      - 'widgets/_src/pc-power-meter-pro/**'
      - 'widgets/_src/desk-notes/**'
      - 'widgets/_src/desk-notes-pro/**'
      - 'widgets/desk-notes/README.txt'
      - 'widgets/desk-notes-pro/README.txt'
      - 'widgets/_src/net-dashboard/**'
      - 'tools/xeneon/native-style-autosync-smoke.mjs'
      - 'tools/xeneon/weather-device-scale-smoke.mjs'
      - 'tools/xeneon/net-dashboard-file-origin-smoke.mjs'
      - '.github/workflows/xeneon-real-icue-round2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  round2:
    name: Physical iCUE feedback recovery
    runs-on: windows-latest
    env:
      SLUGS: 'weather-timeline weather-timeline-pro pc-power-meter pc-power-meter-pro desk-notes desk-notes-pro net-dashboard'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate validate package and extract exact archives
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/packages | Out-Null
          New-Item -ItemType Directory -Force -Path artifacts/extracted | Out-Null
          $slugs = $env:SLUGS -split ' '
          foreach ($slug in $slugs) {
            Get-ChildItem -Path widgets -Filter *.icuewidget -File -ErrorAction SilentlyContinue | Remove-Item -Force
            python tools/xeneon/inline.py $slug
            if ($LASTEXITCODE -ne 0) { throw "inline generation failed for $slug" }
            python tools/xeneon/inline.py $slug --check
            if ($LASTEXITCODE -ne 0) { throw "inline determinism failed for $slug" }
            npx --yes icuewidget-cli@0.4.47 validate "widgets/$slug"
            if ($LASTEXITCODE -ne 0) { throw "official validation failed for $slug" }
            npx --yes icuewidget-cli@0.4.47 package "widgets/$slug"
            if ($LASTEXITCODE -ne 0) { throw "official package failed for $slug" }
            $pkg = Get-ChildItem -Path widgets -Filter *.icuewidget -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if (-not $pkg) { throw "official package missing for $slug" }
            Copy-Item $pkg.FullName "artifacts/packages/$slug.icuewidget"
            New-Item -ItemType Directory -Force -Path "artifacts/extracted/$slug" | Out-Null
          }
          @'
          import pathlib, zipfile
          root = pathlib.Path('artifacts')
          slugs = 'weather-timeline weather-timeline-pro pc-power-meter pc-power-meter-pro desk-notes desk-notes-pro net-dashboard'.split()
          for slug in slugs:
              package = root / 'packages' / f'{slug}.icuewidget'
              out = root / 'extracted' / slug
              if not zipfile.is_zipfile(package):
                  raise SystemExit(f'{slug}: archive is not ZIP compatible')
              with zipfile.ZipFile(package) as archive:
                  bad = archive.testzip()
                  if bad:
                      raise SystemExit(f'{slug}: corrupt package member {bad}')
                  names = set(archive.namelist())
                  for required in ('index.html', 'manifest.json'):
                      if required not in names:
                          raise SystemExit(f'{slug}: missing root {required}')
                  archive.extractall(out)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'exact package integrity failed' }

      - name: Enforce Round 2 exact-package contracts
        shell: pwsh
        run: |
          @'
          import json, pathlib, re
          root = pathlib.Path('artifacts/extracted')

          # Weather: physical device readability override must be present in the
          # inlined archive and setup must honestly expose the WeatherAPI key path.
          for slug in ('weather-timeline', 'weather-timeline-pro'):
              html = (root / slug / 'index.html').read_text(encoding='utf-8')
              if '--weather-u' not in html or 'min-height: 520px' not in html:
                  raise SystemExit(f'{slug}: physical XENEON scaling override missing')
              if 'WeatherAPI Key' not in html or 'Imported widgets may not receive iCUE weather credentials' not in html:
                  raise SystemExit(f'{slug}: weather provider setup guidance missing')

          # Power Pro: sensors-factory must use the documented sensor expression,
          # never a literal [] default. Both editions keep the Custom Style triplet
          # contiguous before the extra graph color.
          pro = (root / 'pc-power-meter-pro' / 'index.html').read_text(encoding='utf-8')
          factory = re.search(r'<meta[^>]+content=["\']comparisonSensors["\'][^>]+>', pro, re.I)
          if not factory:
              raise SystemExit('pc-power-meter-pro: comparison sensors factory missing')
          tag = factory.group(0)
          if 'data-default="[]"' in tag or "data-default='[]'" in tag:
              raise SystemExit('pc-power-meter-pro: sensors-factory still uses invalid empty-array default')
          if "getDefaultSensorIdBlock('power')" not in tag:
              raise SystemExit('pc-power-meter-pro: sensors-factory default is not a power sensor expression')
          for slug in ('pc-power-meter', 'pc-power-meter-pro'):
              html = (root / slug / 'index.html').read_text(encoding='utf-8')
              positions = [html.find(f'content="{name}"') for name in ('textColor','accentColor','backgroundColor','graphColor')]
              if any(pos < 0 for pos in positions) or positions != sorted(positions):
                  raise SystemExit(f'{slug}: Custom Style controls are not in canonical text/accent/background/graph order')
              if 'styleWatchTimer' not in html:
                  raise SystemExit(f'{slug}: no-callback live style watcher missing')

          # Desk Notes: packaged guide plus reduced iCUE group count.
          for slug, expected in (('desk-notes', 2), ('desk-notes-pro', 5)):
              out = root / slug
              if not (out / 'README.txt').is_file():
                  raise SystemExit(f'{slug}: packaged README.txt missing')
              html = (out / 'index.html').read_text(encoding='utf-8')
              match = re.search(r'<script[^>]+id=["\']x-icue-groups["\'][^>]*>(.*?)</script>', html, re.I | re.S)
              if not match:
                  raise SystemExit(f'{slug}: x-icue-groups missing')
              groups = json.loads(match.group(1))
              if len(groups) != expected:
                  raise SystemExit(f'{slug}: expected {expected} settings groups, got {len(groups)}')
              guide = (out / 'README.txt').read_text(encoding='utf-8')
              if '[ ]' not in guide or 'Blank Entry' not in guide:
                  raise SystemExit(f'{slug}: README syntax guide incomplete')

          # Network: exact archive must contain the file-origin-safe transport.
          net = (root / 'net-dashboard' / 'index.html').read_text(encoding='utf-8')
          if 'opaque-https-timing' not in net or "mode: 'no-cors'" not in net:
              raise SystemExit('net-dashboard: file-origin-safe probe transport missing')
          if 'CORS compatible HTTPS URLs' in net:
              raise SystemExit('net-dashboard: obsolete CORS-only user guidance remains')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Round 2 package contract failed' }

      - name: Install Playwright
        shell: pwsh
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install chromium

      - name: Prove Weather physical XENEON readability
        shell: pwsh
        run: |
          node tools/xeneon/weather-device-scale-smoke.mjs artifacts/extracted/weather-timeline/index.html artifacts/weather-device/weather-timeline
          if ($LASTEXITCODE -ne 0) { throw 'Weather Lite physical sizing regression failed' }
          node tools/xeneon/weather-device-scale-smoke.mjs artifacts/extracted/weather-timeline-pro/index.html artifacts/weather-device/weather-timeline-pro
          if ($LASTEXITCODE -ne 0) { throw 'Weather Pro physical sizing regression failed' }

      - name: Prove Power Custom Style without callback timing dependency
        shell: pwsh
        run: |
          node tools/xeneon/native-style-autosync-smoke.mjs artifacts/extracted/pc-power-meter/index.html artifacts/power-style/pc-power-meter
          if ($LASTEXITCODE -ne 0) { throw 'Power Lite no-callback style regression failed' }
          node tools/xeneon/native-style-autosync-smoke.mjs artifacts/extracted/pc-power-meter-pro/index.html artifacts/power-style/pc-power-meter-pro
          if ($LASTEXITCODE -ne 0) { throw 'Power Pro no-callback style regression failed' }

      - name: Prove Power delayed Sensors lifecycle
        shell: pwsh
        run: |
          node tools/xeneon/pc-power-sensor-init-smoke.mjs artifacts/extracted/pc-power-meter/index.html artifacts/power-sensors/pc-power-meter
          if ($LASTEXITCODE -ne 0) { throw 'Power Lite Sensors lifecycle failed' }
          node tools/xeneon/pc-power-sensor-init-smoke.mjs artifacts/extracted/pc-power-meter-pro/index.html artifacts/power-sensors/pc-power-meter-pro
          if ($LASTEXITCODE -ne 0) { throw 'Power Pro Sensors lifecycle failed' }

      - name: Prove Desk Notes settings after group consolidation
        shell: pwsh
        run: |
          node tools/xeneon/desk-notes-settings-smoke.mjs artifacts/extracted/desk-notes/index.html artifacts/desk-notes/desk-notes
          if ($LASTEXITCODE -ne 0) { throw 'Desk Notes Lite settings regression failed' }
          node tools/xeneon/desk-notes-settings-smoke.mjs artifacts/extracted/desk-notes-pro/index.html artifacts/desk-notes/desk-notes-pro
          if ($LASTEXITCODE -ne 0) { throw 'Desk Notes Pro settings regression failed' }

      - name: Prove Network HTTPS timing from file origin
        shell: pwsh
        run: node tools/xeneon/net-dashboard-file-origin-smoke.mjs artifacts/extracted/net-dashboard/index.html artifacts/net-file-origin

      - name: Clone Corsair Labs iCUE Widget Runner
        shell: pwsh
        run: |
          $runnerDir = Join-Path $env:RUNNER_TEMP 'icue-widget-runner-windows'
          if (Test-Path $runnerDir) { Remove-Item -Recurse -Force $runnerDir }
          git clone --depth 1 https://github.com/Corsair-Labs/iCUE-widget-runner-windows.git $runnerDir
          git -C $runnerDir rev-parse HEAD | Set-Content artifacts/corsair-runner-commit.txt
          foreach ($slug in ($env:SLUGS -split ' ')) {
            $target = Join-Path (Join-Path $runnerDir 'widgets') $slug
            if (Test-Path $target) { Remove-Item -Recurse -Force $target }
            Copy-Item -Recurse -Force "artifacts/extracted/$slug" $target
          }

      - name: Corsair Labs exact-package host smoke
        shell: pwsh
        run: |
          $runnerDir = Join-Path $env:RUNNER_TEMP 'icue-widget-runner-windows'
          $stdout = Join-Path $env:RUNNER_TEMP 'corsair-round2.out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'corsair-round2.err.log'
          $process = Start-Process node -ArgumentList 'web-server.js' -WorkingDirectory $runnerDir -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8080/api/widgets -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'Corsair Labs runner did not become ready' }
            foreach ($slug in ($env:SLUGS -split ' ')) {
              node tools/xeneon/icue-runner-smoke.mjs http://127.0.0.1:8080/ $slug "artifacts/icue-runner/$slug"
              if ($LASTEXITCODE -ne 0) { throw "Corsair runner failed for $slug" }
            }
          }
          finally {
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            if (Test-Path $stdout) { Copy-Item $stdout artifacts/corsair-runner.stdout.log }
            if (Test-Path $stderr) { Copy-Item $stderr artifacts/corsair-runner.stderr.log }
          }

      - name: Write final refresh checklist and hashes
        shell: pwsh
        run: |
          @'
          XENEON REAL iCUE ROUND 2 — FINAL REFRESH

          Changed and rebuilt:
          - Weather Timeline Lite
          - Weather Timeline Pro
          - PC Power Meter Lite
          - PC Power Meter Pro
          - Desk Notes Lite
          - Desk Notes Pro
          - Network Dashboard

          Already passed physical iCUE and intentionally unchanged:
          - Work Session Tracker Lite
          - Work Session Tracker Pro
          - Snake

          Real iCUE retest priorities:
          1. Weather: confirm physical XENEON text/icons are now comfortably readable.
          2. PC Power Pro: confirm the archive installs instead of reporting unsupported/corrupted.
          3. PC Power Lite: change Custom Style colors while no power sensor is available and confirm immediate response.
          4. Network Dashboard: confirm HTTPS response timing appears on the physical iCUE host.
          5. Desk Notes: confirm Board Settings remains reachable and README.txt is included in the installed package archive.

          Power telemetry itself still requires a real power sensor exposed by iCUE. A PC with no compatible power sensor cannot validate watt telemetry and the widget must not fabricate it from unrelated sensors.
          '@ | Set-Content -Encoding UTF8 artifacts/RETEST-CHECKLIST.txt
          Get-ChildItem artifacts/packages/*.icuewidget | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ASCII artifacts/SHA256SUMS.txt

      - name: Upload Round 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xeneon-real-icue-round2-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload final refresh packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xeneon-real-icue-round2-final-refresh
          path: |
            artifacts/packages/*.icuewidget
            artifacts/RETEST-CHECKLIST.txt
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
