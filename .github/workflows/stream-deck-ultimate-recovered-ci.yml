name: Stream Deck Ultimate Recovered v1.0 CI

on:
  push:
    branches:
      - main
      - recovery/stream-deck-ultimate-v1-source
    paths:
      - 'plugins/stream-deck-ultimate/**'
      - '.github/workflows/stream-deck-ultimate-recovered-ci.yml'
  workflow_dispatch:

jobs:
  build-validate-pack:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Elgato Stream Deck CLI
        run: npm install -g @elgato/cli@1.9.0

      - name: Build exact v1.0 runtime from recovered source
        shell: powershell
        run: |
          $json = & 'plugins/stream-deck-ultimate/scripts/build-final.ps1'
          $result = $json | ConvertFrom-Json
          if (-not $result.ok) { throw "Recovered Ultimate build did not report ok: $json" }
          if ($result.version -ne '1.0.0.0' -or $result.actions -ne 16) { throw "Unexpected final contract: $json" }
          if ($result.hardwareFixes -ne 'F1-F7 PASS' -or $result.whiteIcons -ne '32 assets PASS') { throw "Acceptance gates did not pass: $json" }
          Write-Host "recovered source build passed: version=$($result.version) actions=$($result.actions)"

      - name: Recheck generated package contract
        shell: powershell
        run: |
          $packages = @(Get-ChildItem -File 'plugins/stream-deck-ultimate/dist' -Filter '*.streamDeckPlugin')
          if ($packages.Count -ne 1) { throw "Expected exactly one packed plugin, found $($packages.Count)" }
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $packages[0].FullName).Hash.ToLowerInvariant()
          Write-Host "PACKED_SHA256=$sha"
          "PACKED_SHA256=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/upload-artifact@v4
        with:
          name: stream-deck-ultimate-v1.0.0-white-icons
          path: plugins/stream-deck-ultimate/dist/*.streamDeckPlugin
          if-no-files-found: error

  packed-artifact-contract:
    needs: build-validate-pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install image verifier dependency
        run: python -m pip install pillow --disable-pip-version-check --quiet

      - uses: actions/download-artifact@v4
        with:
          name: stream-deck-ultimate-v1.0.0-white-icons
          path: packed

      - name: Inspect exact packed artifact
        run: |
          python - <<'PY'
          import io, json, zipfile
          from pathlib import Path
          from PIL import Image

          packages = list(Path('packed').glob('*.streamDeckPlugin'))
          assert len(packages) == 1, packages
          package = packages[0]
          with zipfile.ZipFile(package) as z:
              names = z.namelist()
              roots = sorted({name.split('/', 1)[0] for name in names if '/' in name})
              assert roots == ['com.packrat.stream-deck-ultimate-bundle.sdPlugin'], roots
              root = roots[0] + '/'
              manifest = json.loads(z.read(root + 'manifest.json'))
              assert manifest['Name'] == 'Stream Deck Ultimate'
              assert manifest['Version'] == '1.0.0.0'
              assert manifest['SDKVersion'] == 3
              assert len(manifest['Actions']) == 16
              bases = {manifest['CategoryIcon']}
              bases.update(a['Icon'] for a in manifest['Actions'] if a.get('Icon'))
              files = [root + f'{base}{suffix}.png' for base in bases for suffix in ('', '@2x')]
              assert len(files) == 32, len(files)
              for name in files:
                  image = Image.open(io.BytesIO(z.read(name))).convert('RGBA')
                  assert all((not a) or (r, g, b) == (255, 255, 255) for r, g, b, a in image.getdata()), name
          print('packed v1.0.0 artifact contract passed: 16 actions, SDK 3, 32 white app-list icons')
          PY
