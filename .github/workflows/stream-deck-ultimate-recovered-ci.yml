name: Stream Deck Ultimate Recovered v1.0 CI

on:
  push:
    branches:
      - main
      - recovery/stream-deck-ultimate-v1-source
    paths:
      - 'plugins/stream-deck-ultimate/**'
      - '.github/workflows/stream-deck-ultimate-recovered-ci.yml'
  workflow_dispatch:

jobs:
  stage-native-runtime:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Stage exact hardware-accepted runtime
        shell: powershell
        run: |
          $json = & 'plugins/stream-deck-ultimate/scripts/stage-runtime.ps1'
          $result = $json | ConvertFrom-Json
          if (-not $result.ok) { throw "Recovered Ultimate stage did not report ok: $json" }
          if ($result.version -ne '1.0.0.0' -or $result.actions -ne 16) { throw "Unexpected staged contract: $json" }
          if ($result.hardwareFixes -ne 'F1-F7 PASS') { throw "Hardware acceptance gates did not pass: $json" }
          Write-Host "native runtime staged: version=$($result.version) helper=$($result.helperSha256)"

      - uses: actions/upload-artifact@v4
        with:
          name: stream-deck-ultimate-v1-native-stage
          path: plugins/stream-deck-ultimate/.stage/com.packrat.stream-deck-ultimate-bundle.sdPlugin/**
          if-no-files-found: error

  generate-validate-pack:
    needs: stage-native-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      PLUGIN: plugins/stream-deck-ultimate/.release-stage/com.packrat.stream-deck-ultimate-bundle.sdPlugin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/download-artifact@v4
        with:
          name: stream-deck-ultimate-v1-native-stage
          path: ${{ env.PLUGIN }}

      - name: Install recovered art dependencies
        run: python -m pip install -r plugins/stream-deck-ultimate/authoring/prototype/requirements.txt --disable-pip-version-check --quiet

      - name: Generate accepted profiles and key art
        run: |
          python plugins/stream-deck-ultimate/authoring/prototype/tools/generate_prototype_assets_v71.py "$PLUGIN"
          python plugins/stream-deck-ultimate/authoring/prototype/tools/polish_context_art_v7.py "$PLUGIN"
          python plugins/stream-deck-ultimate/scripts/polish_icons.py "$PLUGIN/imgs/keys" --apply

      - name: Apply Elgato white app-list icon correction
        run: python plugins/stream-deck-ultimate/scripts/whiten_manifest_icons.py "$PLUGIN"

      - name: Verify hardware and Marketplace contracts
        run: |
          python plugins/stream-deck-ultimate/scripts/verify_hardware_fixes.py "$PLUGIN"
          python plugins/stream-deck-ultimate/scripts/verify_white_icons.py "$PLUGIN"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['PLUGIN'])
          m = json.loads((p/'manifest.json').read_text(encoding='utf-8-sig'))
          assert m['Name'] == 'Stream Deck Ultimate'
          assert m['Version'] == '1.0.0.0'
          assert m['SDKVersion'] == 3
          assert len(m['Actions']) == 16
          assert (p/'bin/app-audio/PackRatAppAudio.dll').is_file()
          print('final source contract passed: v1.0.0.0, SDK3, 16 actions, helper present')
          PY

      - name: Install locked runtime dependency
        working-directory: ${{ env.PLUGIN }}
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Install Elgato Stream Deck CLI
        run: npm install -g @elgato/cli@1.9.0

      - name: Officially validate recovered v1.0 runtime
        run: streamdeck validate "$PLUGIN" --force-update-check

      - name: Officially pack recovered v1.0 runtime
        run: |
          mkdir -p plugins/stream-deck-ultimate/dist
          streamdeck pack "$PLUGIN" --output plugins/stream-deck-ultimate/dist --force --no-file-list
          test $(find plugins/stream-deck-ultimate/dist -name '*.streamDeckPlugin' | wc -l) -eq 1

      - uses: actions/upload-artifact@v4
        with:
          name: stream-deck-ultimate-v1.0.0-white-icons
          path: plugins/stream-deck-ultimate/dist/*.streamDeckPlugin
          if-no-files-found: error

  packed-artifact-contract:
    needs: generate-validate-pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install image verifier dependency
        run: python -m pip install pillow --disable-pip-version-check --quiet

      - uses: actions/download-artifact@v4
        with:
          name: stream-deck-ultimate-v1.0.0-white-icons
          path: packed

      - name: Inspect exact packed artifact
        run: |
          python - <<'PY'
          import io, json, zipfile
          from pathlib import Path
          from PIL import Image

          packages = list(Path('packed').glob('*.streamDeckPlugin'))
          assert len(packages) == 1, packages
          package = packages[0]
          with zipfile.ZipFile(package) as z:
              names = z.namelist()
              roots = sorted({name.split('/', 1)[0] for name in names if '/' in name})
              assert roots == ['com.packrat.stream-deck-ultimate-bundle.sdPlugin'], roots
              root = roots[0] + '/'
              manifest = json.loads(z.read(root + 'manifest.json'))
              assert manifest['Name'] == 'Stream Deck Ultimate'
              assert manifest['Version'] == '1.0.0.0'
              assert manifest['SDKVersion'] == 3
              assert len(manifest['Actions']) == 16
              bases = {manifest['CategoryIcon']}
              bases.update(a['Icon'] for a in manifest['Actions'] if a.get('Icon'))
              files = [root + f'{base}{suffix}.png' for base in bases for suffix in ('', '@2x')]
              assert len(files) == 32, len(files)
              for name in files:
                  image = Image.open(io.BytesIO(z.read(name))).convert('RGBA')
                  assert all((not a) or (r, g, b) == (255, 255, 255) for r, g, b, a in image.getdata()), name
          print('packed v1.0.0 artifact contract passed: 16 actions, SDK 3, 32 white app-list icons')
          PY
