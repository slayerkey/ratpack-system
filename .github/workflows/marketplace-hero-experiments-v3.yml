name: Marketplace Hero Experiments V3

on:
  pull_request:
    paths:
      - 'tools/art/marketplace_hero_experiments_v3.py'
      - '.github/workflows/marketplace-hero-experiments-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-experiments:
    runs-on: windows-latest
    env:
      RATPACK_ART_FONT: C:\Windows\Fonts\segoeui.ttf
      RATPACK_ART_FONT_BOLD: C:\Windows\Fonts\segoeuib.ttf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install deterministic art dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==12.3.0
          npm install --no-save playwright@1.62.1
          npx playwright install chromium
      - name: Build PC Power Meter Pro from canonical source
        shell: pwsh
        run: python tools/xeneon/inline.py pc-power-meter-pro
      - name: Capture real PC Power Meter Pro product state
        shell: pwsh
        run: node tools/art/capture_xeneon.mjs pc-power-meter-pro artifacts/hero-experiments-v3/shots
      - name: Render eight bold campaign directions
        shell: pwsh
        run: python tools/art/marketplace_hero_experiments_v3.py --shots artifacts/hero-experiments-v3/shots --out artifacts/hero-experiments-v3/review
      - name: Verify experiment set
        shell: pwsh
        run: |
          foreach ($name in @('01.png','02.png','03.png','04.png','05.png','06.png','07.png','08.png','contact-sheet.jpg','fifteen-percent-sheet.jpg')) {
            if (-not (Test-Path "artifacts/hero-experiments-v3/review/$name")) { throw "Missing $name" }
          }
      - name: Upload experiment set
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-hero-experiments-v3
          path: artifacts/hero-experiments-v3/review/
          if-no-files-found: error
          retention-days: 30
