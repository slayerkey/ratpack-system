name: Marketplace Environment Hero Preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/art/render_environment_hero.py'
      - 'tools/art/scenes/warm-studio-v1/**'
      - 'tools/art/rat_art.py'
      - 'tools/art/capture_xeneon.mjs'
      - 'widgets/_src/pc-power-meter-pro/**'
      - '.github/workflows/marketplace-environment-hero-preview.yml'

permissions:
  contents: read

jobs:
  render-xeneon-preview:
    runs-on: windows-latest
    env:
      RATPACK_ART_FONT: C:\Windows\Fonts\segoeui.ttf
      RATPACK_ART_FONT_BOLD: C:\Windows\Fonts\segoeuib.ttf
    steps:
      - uses: actions/checkout@v4
      - name: Check warm studio scene asset
        id: scene
        shell: pwsh
        run: |
          if (Test-Path 'tools/art/scenes/warm-studio-v1/base.png') {
            'present=true' >> $env:GITHUB_OUTPUT
            'Warm studio base.png found.' >> $env:GITHUB_STEP_SUMMARY
          } else {
            'present=false' >> $env:GITHUB_OUTPUT
            'SCENE_ASSET_REQUIRED: add tools/art/scenes/warm-studio-v1/base.png at exactly 1920x960. Preview intentionally skipped until the binary scene plate is committed.' >> $env:GITHUB_STEP_SUMMARY
          }
      - uses: actions/setup-node@v4
        if: steps.scene.outputs.present == 'true'
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        if: steps.scene.outputs.present == 'true'
        with:
          python-version: '3.13'
      - name: Install deterministic art dependencies
        if: steps.scene.outputs.present == 'true'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==12.3.0
          npm install --no-save playwright@1.62.1
          npx playwright install chromium
      - name: Build PC Power Meter Pro from canonical source
        if: steps.scene.outputs.present == 'true'
        shell: pwsh
        run: python tools/xeneon/inline.py pc-power-meter-pro
      - name: Capture real XENEON product state
        if: steps.scene.outputs.present == 'true'
        shell: pwsh
        run: node tools/art/capture_xeneon.mjs pc-power-meter-pro artifacts/environment-hero/shots
      - name: Render warm studio hero using real capture
        if: steps.scene.outputs.present == 'true'
        shell: pwsh
        run: |
          python tools/art/render_environment_hero.py `
            --scene warm-studio-v1 `
            --shots artifacts/environment-hero/shots `
            --shot XL_H.png `
            --title 'PC POWER' `
            --accent-title 'METER' `
            --subtitle 'for XENEON Edge' `
            --accent '#F2B14B' `
            --out artifacts/environment-hero/pc-power-meter-pro.png
      - name: Create 15 percent review image
        if: steps.scene.outputs.present == 'true'
        shell: pwsh
        run: |
          python -c "from PIL import Image; p='artifacts/environment-hero/pc-power-meter-pro.png'; im=Image.open(p).convert('RGB'); im.resize((288,144),Image.Resampling.LANCZOS).save('artifacts/environment-hero/pc-power-meter-pro-15pct.jpg',quality=96)"
      - name: Upload preview
        if: steps.scene.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-environment-hero-preview
          path: artifacts/environment-hero/
          if-no-files-found: error
          retention-days: 30
