name: Marketplace Environment Hero Preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/art/render_environment_product.py'
      - 'tools/art/render_environment_hero.py'
      - 'tools/art/scenes/warm-studio-v1/**'
      - 'tools/art/rat_art.py'
      - 'tools/art/capture_xeneon.mjs'
      - 'widgets/_src/pc-power-meter-pro/**'
      - '.github/workflows/marketplace-environment-hero-preview.yml'

permissions:
  contents: read

jobs:
  render-xeneon-preview:
    runs-on: windows-latest
    env:
      RATPACK_ART_FONT: C:\Windows\Fonts\segoeui.ttf
      RATPACK_ART_FONT_BOLD: C:\Windows\Fonts\segoeuib.ttf
    steps:
      - uses: actions/checkout@v4

      - name: Verify canonical warm studio scene
        shell: pwsh
        run: |
          $required = @(
            'tools/art/scenes/warm-studio-v1/base.png',
            'tools/art/scenes/warm-studio-v1/geometry.json',
            'tools/art/scenes/warm-studio-v1/title-style.json'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing environment scene asset: $path" }
          }
          Add-Content $env:GITHUB_STEP_SUMMARY 'Warm studio scene assets found.'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install deterministic art dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==12.3.0
          npm install --no-save playwright@1.62.1
          npx playwright install chromium

      - name: Build PC Power Meter Pro from canonical source
        shell: pwsh
        run: python tools/xeneon/inline.py pc-power-meter-pro

      - name: Capture real XENEON product states
        shell: pwsh
        run: node tools/art/capture_xeneon.mjs pc-power-meter-pro artifacts/environment-hero/shots

      - name: Render complete Rat Art set with environment hero
        shell: pwsh
        run: |
          python tools/art/render_environment_product.py xeneon pc-power-meter-pro `
            --shots artifacts/environment-hero/shots `
            --out artifacts/environment-hero/review

      - name: Verify environment hero integration
        shell: pwsh
        run: |
          $required = @(
            '1-hero.png',
            '2-showcase.png',
            '3-features.png',
            '4-settings.png',
            '5-sizes.png',
            'contact-sheet.jpg',
            'thumbnail-sheet.jpg',
            'rat-art-report.json'
          )
          foreach ($name in $required) {
            $path = "artifacts/environment-hero/review/$name"
            if (-not (Test-Path $path)) { throw "Missing final Rat Art output: $name" }
          }

          $report = Get-Content 'artifacts/environment-hero/review/rat-art-report.json' -Raw | ConvertFrom-Json
          if (-not $report.environment_hero.enabled) { throw 'environment_hero report flag is not enabled' }
          if ($report.environment_hero.scene -ne 'warm-studio-v1') { throw 'unexpected environment hero scene' }
          if ($report.environment_hero.image_generation -ne 'disabled') { throw 'environment hero must remain deterministic' }
          if ($report.design_system -notlike '*environment:warm-studio-v1*') { throw 'environment design system was not recorded' }
          Add-Content $env:GITHUB_STEP_SUMMARY 'Environment hero rendered from real XENEON capture with image generation disabled.'

      - name: Upload final environment Rat Art set
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-environment-hero-preview
          path: artifacts/environment-hero/review/
          if-no-files-found: error
          retention-days: 30
