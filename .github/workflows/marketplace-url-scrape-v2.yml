name: Marketplace URL Discovery V2

on:
  push:
    branches:
      - audit/lite-pro-sync-2026-09-01
    paths:
      - .github/workflows/marketplace-url-scrape-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Read live PackRat Marketplace
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');
          (async () => {
            const targets = [
              'Weather Timeline Lite','Weather Timeline Pro',
              'Work Session Tracker Lite','Work Session Tracker Pro',
              'Desk Notes Lite','Desk Notes Pro',
              'PC Power Meter Lite','PC Power Meter Pro',
              'Better Hotkeys & Mouse','Better Hotkeys & Mouse Pro',
              'Clipboard Manager','Clipboard Manager Pro',
              'Window Manager Lite','Window Manager Pro',
              'Workflow Automation Lite','Workflow Automation Pro',
              'Calendar Sync Lite','Calendar Sync Pro',
              'Epic Pen Profile','Epic Pen Pro Profile',
              'Claude & OpenAI Cost Monitor','Claude & OpenAI Cost Pro',
              'DaVinci Resolve Lite','DaVinci Resolve Pro'
            ];
            const known = [
              ['Weather Timeline Lite','https://marketplace.elgato.com/product/weather-timeline-lite-418f836f-b5fb-4456-b412-9b7fe9295aa0'],
              ['Weather Timeline Pro','https://marketplace.elgato.com/product/weather-timeline-pro-160c8019-ce77-49d8-a306-8ef1764a70c5'],
              ['Work Session Tracker Lite','https://marketplace.elgato.com/product/work-session-tracker-lite-e11e003d-5ca3-4c2d-ba94-f37fca8dabc7'],
              ['Work Session Tracker Pro','https://marketplace.elgato.com/product/work-session-tracker-pro-f8e12d94-4354-41ca-b6da-beb2297fb9e2'],
              ['Desk Notes Lite','https://marketplace.elgato.com/product/desk-notes-lite-3926a6a3-5860-4e11-a01b-7e90f8a4c900'],
              ['PC Power Meter Lite','https://marketplace.elgato.com/product/pc-power-meter-lite-113488ed-3043-48b5-96d0-67c2130cc1ed'],
              ['DaVinci Resolve Lite','https://marketplace.elgato.com/product/davinci-resolve-lite-f76cfeae-614a-4381-ab7a-a8e8d6298285'],
              ['DaVinci Resolve Pro','https://marketplace.elgato.com/product/davinci-resolve-pro-b703cfa1-1e25-4c62-b26d-30a70ab33933']
            ];
            const norm = s => String(s || '').replace(/\s+/g,' ').trim();
            const out = { generatedAt:new Date().toISOString(), anchors:[], responses:[], exact:{}, candidates:[] };
            const browser = await chromium.launch({headless:true});
            const ctx = await browser.newContext({viewport:{width:1600,height:1200}});
            const page = await ctx.newPage();
            const responseSeen = new Set();
            page.on('response', async r => {
              try {
                const u=r.url();
                if (!/elgato|marketplace|gateway/i.test(u) || responseSeen.has(u)) return;
                responseSeen.add(u);
                const ct=(r.headers()['content-type']||'').toLowerCase();
                if (!ct.includes('json')) return;
                const text=await r.text();
                const hits=targets.filter(t=>text.toLowerCase().includes(t.toLowerCase()));
                if(hits.length) out.responses.push({url:u,status:r.status(),hits,text:text.slice(0,500000)});
              } catch(e) {}
            });
            async function settle(ms=1200){
              await page.waitForTimeout(ms);
              for(let i=0;i<15;i++){
                await page.evaluate(()=>window.scrollTo(0,document.body.scrollHeight));
                await page.waitForTimeout(350);
              }
              await page.evaluate(()=>window.scrollTo(0,0));
              await page.waitForTimeout(400);
            }
            async function collect(source){
              const rows=await page.evaluate(()=>[...document.querySelectorAll('a[href]')].map(a=>({href:a.href,text:(a.innerText||a.textContent||'').replace(/\s+/g,' ').trim(),aria:a.getAttribute('aria-label')||'',title:a.getAttribute('title')||''})).filter(x=>x.href.includes('/product/')));
              for(const r of rows) if(!out.anchors.some(x=>x.href===r.href)) out.anchors.push({...r,source});
            }
            for(const url of ['https://marketplace.elgato.com/@packrat','https://marketplace.elgato.com/maker/packrat']){
              try{ const res=await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000}); await settle(); await collect(url); out.candidates.push({label:url,status:res?.status(),finalUrl:page.url(),title:await page.title(),body:norm((await page.locator('body').innerText()).slice(0,120000))}); }catch(e){out.candidates.push({label:url,error:String(e)});}
            }
            for(const target of targets){
              try{
                const url='https://marketplace.elgato.com/search?q='+encodeURIComponent(target);
                const res=await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
                await settle(700); await collect('search:'+target);
                out.candidates.push({label:'search:'+target,status:res?.status(),finalUrl:page.url(),title:await page.title(),body:norm((await page.locator('body').innerText()).slice(0,30000))});
              }catch(e){out.candidates.push({label:'search:'+target,error:String(e)});}
            }
            for(const [label,url] of known){
              try{
                const res=await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
                await page.waitForTimeout(1000);
                const body=norm((await page.locator('body').innerText()).slice(0,30000));
                const rec={label,requestedUrl:url,status:res?.status(),finalUrl:page.url(),title:await page.title(),body,packrat:/packrat/i.test(body)};
                out.candidates.push(rec);
                if(rec.status===200 && rec.finalUrl.includes('/product/') && body.toLowerCase().includes(label.toLowerCase()) && rec.packrat) out.exact[label]=rec.finalUrl.split('?')[0];
              }catch(e){out.candidates.push({label,requestedUrl:url,error:String(e)});}
            }
            for(const target of targets){
              const words=target.toLowerCase().replace(/[^a-z0-9 ]/g,'').split(/\s+/).filter(Boolean);
              const found=out.anchors.filter(a=>{
                const hay=norm([a.text,a.aria,a.title,a.href].join(' ')).toLowerCase();
                return hay.includes(target.toLowerCase()) || (words.length>=2 && words.every(w=>hay.includes(w)));
              });
              if(found.length===1) out.exact[target]=found[0].href.split('?')[0];
              else if(found.length>1) out.exact[target]=found.map(x=>x.href.split('?')[0]);
            }
            fs.writeFileSync('marketplace-links.json',JSON.stringify(out,null,2));
            console.log('EXACT_START');
            console.log(JSON.stringify(out.exact,null,2));
            console.log('EXACT_END');
            console.log('ANCHORS_START');
            console.log(JSON.stringify(out.anchors,null,2));
            console.log('ANCHORS_END');
            console.log('JSON_HITS',JSON.stringify(out.responses.map(x=>({url:x.url,status:x.status,hits:x.hits})),null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-url-discovery-v2
          path: marketplace-links.json
          if-no-files-found: error
