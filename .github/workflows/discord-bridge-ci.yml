name: Discord Bridge Release QA

on:
  push:
    branches:
      - product/discord-bridge
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release:
    name: Windows build, test, validate, pack
    runs-on: windows-latest
    defaults:
      run:
        working-directory: plugins/discord-bridge
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install locked dependencies
        shell: pwsh
        run: npm ci

      - name: Audit dependencies
        shell: pwsh
        run: npm audit --audit-level=high

      - name: Run automated tests
        shell: pwsh
        run: npm test

      - name: Build bundled plugin
        shell: pwsh
        run: npm run build

      - name: Verify minimal immutable distribution
        shell: pwsh
        run: |
          $bin = Get-ChildItem com.packrat.discord-bridge.sdPlugin/bin -File
          if ($bin.Count -ne 1 -or $bin[0].Name -ne 'plugin.js') {
            throw "Expected exactly bin/plugin.js in the release bundle"
          }
          $bundle = Get-Content com.packrat.discord-bridge.sdPlugin/bin/plugin.js -Raw
          if ($bundle -match 'client_secret') {
            throw 'Release bundle must not contain a Discord client secret'
          }

      - name: Validate with official Elgato CLI
        shell: pwsh
        run: npm run validate

      - name: Package with official Elgato CLI
        shell: pwsh
        run: npm run pack

      - name: Verify package output
        shell: pwsh
        run: |
          $pkg = Get-ChildItem dist -Filter *.streamDeckPlugin -File | Select-Object -First 1
          if (-not $pkg) { throw 'Elgato CLI did not produce a .streamDeckPlugin package' }
          Get-FileHash $pkg.FullName -Algorithm SHA256 | Format-List

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: discord-bridge-release-qa
          path: |
            plugins/discord-bridge/dist/*.streamDeckPlugin
            plugins/discord-bridge/package-lock.json
            plugins/discord-bridge/com.packrat.discord-bridge.sdPlugin/manifest.json
          if-no-files-found: error
          retention-days: 30
