name: Marketplace URL Discovery Fast

on:
  push:
    branches:
      - audit/lite-pro-sync-2026-09-01
    paths:
      - .github/workflows/marketplace-url-scrape-fast.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright core
        run: npm install --no-save playwright-core@1.55.0
      - name: Extract rendered PackRat cards
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright-core');
          const { execSync } = require('child_process');
          (async()=>{
            let executable='';
            for(const cmd of ['google-chrome','google-chrome-stable','chromium','chromium-browser']){
              try{ executable=execSync('command -v '+cmd,{encoding:'utf8'}).trim(); if(executable) break; }catch(e){}
            }
            if(!executable) throw new Error('No system Chromium/Chrome found');
            console.log('BROWSER',executable);
            const browser=await chromium.launch({headless:true,executablePath:executable,args:['--no-sandbox']});
            const ctx=await browser.newContext({viewport:{width:1800,height:1400}});
            const page=await ctx.newPage();
            const network=[];
            page.on('response',async r=>{
              try{
                const u=r.url();
                if(!/mp-gateway|marketplace\.elgato/i.test(u)) return;
                const ct=(r.headers()['content-type']||'').toLowerCase();
                if(!ct.includes('json')) return;
                const txt=await r.text();
                if(/PackRat|Weather Timeline|Work Session Tracker|Desk Notes|PC Power Meter|Better Hotkeys|Clipboard Manager|Window Manager|Workflow Automation|Calendar Sync|Epic Pen|Cost Monitor/i.test(txt)) network.push({url:u,status:r.status(),body:txt.slice(0,1000000)});
              }catch(e){}
            });
            const res=await page.goto('https://marketplace.elgato.com/@packrat',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(2500);
            let last=0;
            for(let i=0;i<30;i++){
              await page.evaluate(()=>window.scrollTo(0,document.body.scrollHeight));
              await page.waitForTimeout(250);
              const h=await page.evaluate(()=>document.body.scrollHeight);
              if(h===last && i>8) break;
              last=h;
            }
            await page.waitForTimeout(1000);
            const anchors=await page.evaluate(()=>[...document.querySelectorAll('a[href]')].map(a=>({href:a.href,text:(a.innerText||a.textContent||'').replace(/\s+/g,' ').trim(),aria:a.getAttribute('aria-label')||'',title:a.getAttribute('title')||'',parent:(a.parentElement?.innerText||'').replace(/\s+/g,' ').trim().slice(0,500)})).filter(x=>x.href.includes('/product/')));
            const uniq=[]; for(const a of anchors) if(!uniq.some(x=>x.href===a.href)) uniq.push(a);
            const out={status:res?.status(),finalUrl:page.url(),title:await page.title(),cards:uniq,network};
            fs.writeFileSync('marketplace-fast.json',JSON.stringify(out,null,2));
            console.log('CARDS_START'); console.log(JSON.stringify(uniq,null,2)); console.log('CARDS_END');
            console.log('NETWORK_SUMMARY',JSON.stringify(network.map(x=>({url:x.url,status:x.status,bytes:x.body.length})),null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: marketplace-url-discovery-fast
          path: marketplace-fast.json
          if-no-files-found: error
