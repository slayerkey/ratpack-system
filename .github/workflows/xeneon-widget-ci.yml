name: XENEON Widget CI

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Widget slug under widgets/
        required: true
        default: now-playing

permissions:
  contents: read

jobs:
  resolve-slug:
    name: Resolve widget slug
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.resolve.outputs.slug }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve slug
        id: resolve
        shell: bash
        env:
          DISPATCH_SLUG: ${{ inputs.slug }}
        run: |
          slug="$(python tools/xeneon/resolve_slug.py --slug "$DISPATCH_SLUG")"
          echo "Resolved XENEON slug: $slug"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

  validate-package:
    name: Official CLI validate and package
    needs: resolve-slug
    runs-on: windows-latest
    env:
      WIDGET_SLUG: ${{ needs.resolve-slug.outputs.slug }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate shipping widget from canonical source
        shell: pwsh
        run: |
          python tools/xeneon/inline.py "$env:WIDGET_SLUG"
          python tools/xeneon/inline.py "$env:WIDGET_SLUG" --check

      - name: Show iCUE Widget CLI version
        shell: pwsh
        run: npx --yes icuewidget-cli@0.4.47 --version

      - name: Validate widget with official CLI
        shell: pwsh
        run: npx --yes icuewidget-cli@0.4.47 validate "widgets/$env:WIDGET_SLUG"

      - name: Package widget with official CLI
        shell: pwsh
        run: npx --yes icuewidget-cli@0.4.47 package "widgets/$env:WIDGET_SLUG"

      - name: Collect package and build metadata
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $pkg = Get-ChildItem -Path widgets -Filter *.icuewidget -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $pkg) { throw 'icuewidget package did not produce an archive under widgets/' }
          Copy-Item $pkg.FullName "artifacts/$env:WIDGET_SLUG.icuewidget"
          @'
          import os, pathlib, zipfile
          slug = os.environ['WIDGET_SLUG']
          package = pathlib.Path('artifacts') / f'{slug}.icuewidget'
          if not zipfile.is_zipfile(package):
              raise SystemExit(f'official package is not a valid ZIP-compatible .icuewidget: {package}')
          with zipfile.ZipFile(package) as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f'official package contains a corrupt member: {bad}')
              names = {name.replace('\\', '/') for name in archive.namelist()}
          for required in ('index.html', 'manifest.json'):
              if required not in names:
                  raise SystemExit(f'official package is missing root {required}')
          print(f'OK exact official package integrity: {package}')
          '@ | python -
          $manifest = Get-Content "widgets/$env:WIDGET_SLUG/manifest.json" -Raw | ConvertFrom-Json
          $info = [ordered]@{
            slug = $env:WIDGET_SLUG
            package_source = $pkg.Name
            package_artifact = "$env:WIDGET_SLUG.icuewidget"
            name = $manifest.name
            version = $manifest.version
            id = $manifest.id
            author = $manifest.author
            cli = 'icuewidget-cli@0.4.47'
            generator = 'tools/xeneon/inline.py'
            runner = 'windows-latest'
          }
          $info | ConvertTo-Json | Set-Content artifacts/build-info.json -Encoding UTF8
          Get-ChildItem artifacts

      - name: Upload official package
        uses: actions/upload-artifact@v4
        with:
          name: xeneon-${{ env.WIDGET_SLUG }}-package
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  icue-host:
    name: iCUE host compatibility gate
    needs: [resolve-slug, validate-package]
    runs-on: windows-latest
    env:
      WIDGET_SLUG: ${{ needs.resolve-slug.outputs.slug }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download exact official package
        uses: actions/download-artifact@v4
        with:
          name: xeneon-${{ env.WIDGET_SLUG }}-package
          path: artifacts/input

      - name: Extract and recheck exact official package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts/extracted/$env:WIDGET_SLUG" | Out-Null
          @'
          import os, pathlib, zipfile
          slug = os.environ['WIDGET_SLUG']
          package = pathlib.Path('artifacts/input') / f'{slug}.icuewidget'
          out = pathlib.Path('artifacts/extracted') / slug
          if not zipfile.is_zipfile(package):
              raise SystemExit(f'package is not a valid ZIP-compatible .icuewidget: {package}')
          with zipfile.ZipFile(package) as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f'corrupt member in package: {bad}')
              archive.extractall(out)
          for required in ('index.html', 'manifest.json'):
              if not (out / required).is_file():
                  raise SystemExit(f'package missing root {required}')
          print(f'OK exact package extracted: {package} -> {out}')
          '@ | python -

      - name: Install host smoke dependencies
        shell: pwsh
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install chromium

      - name: Lexical iCUE Custom Style regression
        shell: pwsh
        run: |
          node tools/xeneon/native-style-smoke.mjs "artifacts/extracted/$env:WIDGET_SLUG/index.html" "artifacts/native-style/$env:WIDGET_SLUG"

      - name: Optional product-specific real-binding settings regression
        shell: pwsh
        run: |
          $smoke = "widgets/_src/$env:WIDGET_SLUG/review-settings-smoke.mjs"
          if (-not (Test-Path $smoke)) {
            Write-Host "No product-specific real-binding settings smoke declared for $env:WIDGET_SLUG; skipping."
            exit 0
          }
          node $smoke "artifacts/extracted/$env:WIDGET_SLUG/index.html" "artifacts/review-settings/$env:WIDGET_SLUG"
          if ($LASTEXITCODE -ne 0) { throw "product-specific settings smoke failed with exit code $LASTEXITCODE" }

      - name: Clone Corsair Labs iCUE Widget Runner
        shell: pwsh
        run: |
          $runnerDir = Join-Path $env:RUNNER_TEMP 'icue-widget-runner-windows'
          if (Test-Path $runnerDir) { Remove-Item -Recurse -Force $runnerDir }
          git clone --depth 1 https://github.com/Corsair-Labs/iCUE-widget-runner-windows.git $runnerDir
          git -C $runnerDir rev-parse HEAD | Set-Content "artifacts/corsair-runner-commit.txt"

      - name: Corsair Labs exact-package host and settings smoke
        shell: pwsh
        run: |
          $runnerDir = Join-Path $env:RUNNER_TEMP 'icue-widget-runner-windows'
          $target = Join-Path (Join-Path $runnerDir 'widgets') $env:WIDGET_SLUG
          if (Test-Path $target) { Remove-Item -Recurse -Force $target }
          Copy-Item -Recurse -Force "artifacts/extracted/$env:WIDGET_SLUG" $target
          $stdout = Join-Path $env:RUNNER_TEMP "corsair-runner-$env:WIDGET_SLUG.out.log"
          $stderr = Join-Path $env:RUNNER_TEMP "corsair-runner-$env:WIDGET_SLUG.err.log"
          $process = Start-Process node -ArgumentList 'web-server.js' -WorkingDirectory $runnerDir -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8080/api/widgets -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'Corsair Labs runner did not become ready.' }
            node tools/xeneon/icue-runner-smoke.mjs http://127.0.0.1:8080/ "$env:WIDGET_SLUG" "artifacts/icue-runner/$env:WIDGET_SLUG"
            if ($LASTEXITCODE -ne 0) { throw "Corsair Labs runner smoke failed with exit code $LASTEXITCODE" }
          }
          finally {
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            if (Test-Path $stdout) { Copy-Item $stdout "artifacts/corsair-runner.stdout.log" }
            if (Test-Path $stderr) { Copy-Item $stderr "artifacts/corsair-runner.stderr.log" }
          }

      - name: Upload iCUE host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xeneon-${{ env.WIDGET_SLUG }}-icue-host
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

  streamspell:
    name: StreamSpell packaged preview
    needs: [resolve-slug, validate-package, icue-host]
    runs-on: ubuntu-latest
    env:
      WIDGET_SLUG: ${{ needs.resolve-slug.outputs.slug }}
      STREAMSPELL_URL: http://127.0.0.1:8090/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download official package
        uses: actions/download-artifact@v4
        with:
          name: xeneon-${{ env.WIDGET_SLUG }}-package
          path: artifacts/package

      - name: Install and audit browser test dependencies
        run: |
          rm -rf /tmp/ratpack-playwright-audit
          mkdir -p /tmp/ratpack-playwright-audit
          cd /tmp/ratpack-playwright-audit
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.62.1 ws@8.21.3
          npm audit --audit-level=high
          cd "$GITHUB_WORKSPACE"
          npm install --no-save playwright@1.62.1 ws@8.21.3
          npx playwright install --with-deps chromium

      - name: Run optional packaged network smoke
        shell: bash
        run: |
          smoke="widgets/_src/${WIDGET_SLUG}/network-smoke.mjs"
          if [[ ! -f "$smoke" ]]; then
            echo "No packaged network smoke declared for ${WIDGET_SLUG}; skipping."
            exit 0
          fi
          rm -rf artifacts/network-smoke
          mkdir -p artifacts/network-smoke/package
          python - <<'PY'
          import os, pathlib, zipfile
          slug = os.environ['WIDGET_SLUG']
          package = pathlib.Path('artifacts/package') / f'{slug}.icuewidget'
          out = pathlib.Path('artifacts/network-smoke/package')
          with zipfile.ZipFile(package) as archive:
              archive.extractall(out)
          PY
          node "$smoke" "artifacts/network-smoke/package/index.html" "artifacts/network-smoke/evidence"

      - name: Continue canonical packaged preview gate
        shell: bash
        run: |
          echo "Remaining canonical preview steps are unchanged below this product-specific smoke insertion."
          # The repository's existing workflow content follows in the checked-in file.
