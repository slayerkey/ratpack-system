name: Claude Auto Queue Spike CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'plugins/claude-auto-queue/**'
      - '.github/workflows/claude-auto-queue-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-streamdeck:
    runs-on: windows-latest
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v4
        with:
          ref: product/claude-auto-queue

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: plugins/claude-auto-queue
        run: npm install --no-fund --no-audit

      - name: Commit generated package lock once
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/claude-auto-queue/package-lock.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Lock Claude Auto Queue dependencies"
            git push origin HEAD:product/claude-auto-queue
          }

      - name: Build plugin
        working-directory: plugins/claude-auto-queue
        run: npm run build

      - name: Run feasibility fixtures
        working-directory: plugins/claude-auto-queue
        run: npm test

      - name: Validate with official Stream Deck CLI
        working-directory: plugins/claude-auto-queue
        run: npx streamdeck validate com.packrat.claude-auto-queue.sdPlugin
