name: Marketplace Listing V2 Prototype CI

# Dedicated visual-system gate for representative XENEON and Stream Deck products.
on:
  pull_request:
    paths:
      - 'tools/art/**'
      - 'skills/rat-art/**'
      - 'standards/marketplace-listing-v2.md'
      - 'docs/MARKETPLACE_LISTING_V2_AUDIT.md'
      - 'products/index.json'
      - 'widgets/_src/now-playing/**'
      - 'widgets/_src/pc-power-meter-pro/**'
      - 'widgets/_src/weather-timeline/**'
      - 'widgets/_src/weather-timeline-pro/**'
      - 'plugins/claude-auto-queue/**'
      - '.github/workflows/marketplace-listing-v2-ci.yml'
  workflow_dispatch:

concurrency:
  group: marketplace-listing-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  catalog-safety-audit:
    name: Audit published catalog source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Audit registry source availability
        run: |
          python tools/art/marketplace_catalog_audit.py \
            --status published \
            --json-out artifacts/catalog/published-source-audit.json \
            --md-out artifacts/catalog/published-source-audit.md
          python -m py_compile tools/art/marketplace_catalog_audit.py tools/art/marketplace_catalog_contact_sheet.py tools/art/render_environment_product.py tools/art/render_environment_hero.py

      - name: Upload catalog source audit
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-v2-published-source-audit
          path: artifacts/catalog/
          if-no-files-found: error
          retention-days: 30

  render-xeneon-prototype:
    name: Render ${{ matrix.slug }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        slug:
          - now-playing
          - pc-power-meter-pro
          - weather-timeline
          - weather-timeline-pro
    env:
      WIDGET_SLUG: ${{ matrix.slug }}
      RATPACK_ART_FONT: C:\Windows\Fonts\segoeui.ttf
      RATPACK_ART_FONT_BOLD: C:\Windows\Fonts\segoeuib.ttf

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install deterministic art dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==12.3.0
          npm install --no-save playwright@1.62.1
          npm audit --audit-level=high
          npx playwright install chromium

      - name: Build shipping widget from canonical source
        shell: pwsh
        run: python tools/xeneon/inline.py $env:WIDGET_SLUG

      - name: Capture real widget at native XENEON slots
        shell: pwsh
        run: node tools/art/capture_xeneon.mjs $env:WIDGET_SLUG "artifacts/marketplace-v2/$env:WIDGET_SLUG/shots"

      - name: Render Marketplace Listing V2 candidate
        shell: pwsh
        run: |
          $shots = "artifacts/marketplace-v2/$env:WIDGET_SLUG/shots"
          $out = "artifacts/marketplace-v2/$env:WIDGET_SLUG/review"
          if ($env:WIDGET_SLUG -eq 'pc-power-meter-pro') {
            python tools/art/render_environment_product.py xeneon $env:WIDGET_SLUG --shots $shots --out $out
          } else {
            python tools/art/rat_art.py xeneon $env:WIDGET_SLUG --shots $shots --out $out
          }

      - name: Verify V2 contract
        shell: pwsh
        run: |
          $dir = "artifacts/marketplace-v2/$env:WIDGET_SLUG/review"
          $report = Get-Content "$dir/rat-art-report.json" -Raw | ConvertFrom-Json
          if ($report.image_generation -ne 'disabled') { throw 'Image generation must stay disabled.' }
          if ($report.schema_version -ne 4) { throw 'V2 report schema must be 4.' }

          if ($env:WIDGET_SLUG -eq 'pc-power-meter-pro') {
            if ($report.design_system -ne 'marketplace-listing-v2+environment:warm-studio-v1') { throw 'PC Power Meter Pro did not use the warm studio environment hero.' }
            if (-not $report.environment_hero.enabled) { throw 'Environment hero report flag missing.' }
            if ($report.environment_hero.image_generation -ne 'disabled') { throw 'Environment hero must remain deterministic.' }
            if ($report.environment_hero.scene -ne 'warm-studio-v1') { throw 'Unexpected environment scene.' }
          } elseif ($report.design_system -ne 'marketplace-listing-v2') {
            throw 'Prototype did not render through Marketplace Listing V2.'
          }

          if (-not (Test-Path "$dir/contact-sheet.jpg")) { throw 'Missing V2 contact sheet.' }
          if (-not (Test-Path "$dir/thumbnail-sheet.jpg")) { throw 'Missing V2 thumbnail sheet.' }
          foreach ($name in @('1-hero.png','2-showcase.png','3-features.png','4-settings.png','5-sizes.png')) {
            if (-not (Test-Path "$dir/$name")) { throw "Missing $name" }
          }

      - name: Upload V2 candidate
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-v2-${{ matrix.slug }}
          path: artifacts/marketplace-v2/${{ matrix.slug }}/
          if-no-files-found: error
          retention-days: 30

  render-stream-deck-prototype:
    name: Render claude-auto-queue
    runs-on: windows-latest
    env:
      RATPACK_ART_FONT: C:\Windows\Fonts\segoeui.ttf
      RATPACK_ART_FONT_BOLD: C:\Windows\Fonts\segoeuib.ttf

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install deterministic art dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0

      - name: Render Stream Deck V2 candidate
        shell: pwsh
        run: ./plugins/claude-auto-queue/rat-art.ps1 -Destination "artifacts/marketplace-v2/claude-auto-queue/review"

      - name: Verify Stream Deck V2 contract
        shell: pwsh
        run: |
          $dir = "artifacts/marketplace-v2/claude-auto-queue/review"
          $report = Get-Content "$dir/rat-art-report.json" -Raw | ConvertFrom-Json
          if ($report.image_generation -ne 'disabled') { throw 'Image generation must stay disabled.' }
          if ($report.design_system -ne 'marketplace-listing-v2') { throw 'Stream Deck prototype did not render through Marketplace Listing V2.' }
          if (-not (Test-Path "$dir/contact-sheet.jpg")) { throw 'Missing Stream Deck V2 contact sheet.' }
          if (-not (Test-Path "$dir/thumbnail-sheet.jpg")) { throw 'Missing Stream Deck V2 thumbnail sheet.' }
          foreach ($name in @('01_search_icon.png','02_cover.png','03_gallery_01.png','04_gallery_02.png','05_gallery_03.png','06_gallery_04.png')) {
            if (-not (Test-Path "$dir/$name")) { throw "Missing $name" }
          }

      - name: Upload Stream Deck V2 candidate
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-v2-claude-auto-queue
          path: artifacts/marketplace-v2/claude-auto-queue/
          if-no-files-found: error
          retention-days: 30
