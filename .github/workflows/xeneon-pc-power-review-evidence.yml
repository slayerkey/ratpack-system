name: XENEON PC Power Review Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/xeneon/pc-power-review-demo.mjs'
      - 'tools/xeneon/inline.py'
      - 'widgets/_src/pc-power-meter/**'
      - 'widgets/_shared/pc-power-meter/**'
      - 'widgets/pc-power-meter/**'
      - '.github/workflows/xeneon-pc-power-review-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-demo:
    name: Exact-package simulated sensor demo
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate, validate, and package PC Power Meter Lite
        shell: pwsh
        run: |
          python tools/xeneon/inline.py pc-power-meter
          python tools/xeneon/inline.py pc-power-meter --check
          npx --yes icuewidget-cli@0.4.47 validate widgets/pc-power-meter
          npx --yes icuewidget-cli@0.4.47 package widgets/pc-power-meter

      - name: Extract exact official package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/package | Out-Null
          New-Item -ItemType Directory -Force -Path artifacts/extracted/pc-power-meter | Out-Null
          $pkg = Get-ChildItem -Path widgets -Filter *.icuewidget -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $pkg) { throw 'Official package was not created.' }
          Copy-Item $pkg.FullName artifacts/package/pc-power-meter.icuewidget
          @'
          import pathlib, zipfile
          package = pathlib.Path('artifacts/package/pc-power-meter.icuewidget')
          if not zipfile.is_zipfile(package):
              raise SystemExit('official package is not ZIP-compatible')
          with zipfile.ZipFile(package) as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f'corrupt package member: {bad}')
              archive.extractall('artifacts/extracted/pc-power-meter')
          '@ | python -

      - name: Install browser recorder
        shell: pwsh
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install chromium

      - name: Record transparent simulated-provider demo
        shell: pwsh
        run: |
          node tools/xeneon/pc-power-review-demo.mjs artifacts/extracted/pc-power-meter/index.html artifacts/review-demo

      - name: Convert reviewer demo to MP4 when FFmpeg is available
        shell: pwsh
        run: |
          $ffmpeg = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if (-not $ffmpeg) {
            Write-Host 'FFmpeg is not available on this runner; preserving WebM recording.'
            exit 0
          }
          ffmpeg -y -i artifacts/review-demo/pc-power-meter-review-demo.webm -c:v libx264 -pix_fmt yuv420p -movflags +faststart -an artifacts/review-demo/pc-power-meter-review-demo.mp4

      - name: Upload reviewer evidence
        uses: actions/upload-artifact@v4
        with:
          name: pc-power-meter-review-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
