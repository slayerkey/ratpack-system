<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="resources/icon.svg" />
<title>tr('Work Session Tracker Lite')</title>
<meta name="x-icue-property" content="textColor" data-label="tr('Text Color')" data-type="color" data-default="'#F4F6F8'" />
<meta name="x-icue-property" content="accentColor" data-label="tr('Accent Color')" data-type="color" data-default="'#2BE86A'" />
<meta name="x-icue-property" content="backgroundColor" data-label="tr('Background Color')" data-type="color" data-default="'#07090D'" />
<script type="application/json" id="x-icue-groups">[{"title":"tr('Appearance')","properties":["textColor","accentColor","backgroundColor"]}]</script>
<link rel="stylesheet" href="session-base.css" />
<link rel="stylesheet" href="session-responsive.css" />
</head>
<body data-slot="s-h" data-edition="lite" data-session-state="idle">
<main class="stage" aria-label="Work Session Tracker Lite">
  <section class="current-card">
    <span class="edition">LITE</span>
    <div id="currentLabel" class="eyebrow">READY TO FOCUS</div>
    <h1 id="currentName" class="current-name">What are you working on?</h1>
    <div id="elapsed" class="elapsed">00:00:00</div>
    <div id="idleControls" class="idle-controls">
      <input id="projectInput" maxlength="72" autocomplete="off" aria-label="Session or project name" placeholder="Session or project name" />
      <button id="startButton" class="primary">START</button>
    </div>
    <div id="activeControls" class="active-controls" hidden>
      <button id="pauseResume" class="secondary">PAUSE</button>
      <button id="finishButton" class="secondary finish">FINISH</button>
    </div>
    <div class="utility-row">
      <span class="tiny-label">PRO AVAILABLE</span>
      <button id="upgradeButton" class="quiet upgrade" aria-label="Upgrade to Work Session Tracker Pro" title="Upgrade to Work Session Tracker Pro">UPGRADE →</button>
    </div>
  </section>
  <section class="right">
    <div class="summary">
      <div class="today-card">
        <div class="section-label">FOCUSED TODAY</div>
        <div id="todayTotal" class="today-total">0m</div>
        <div id="todayStatus" class="today-status">TODAY</div>
      </div>
      <div class="timeline-wrap">
        <div class="section-label">TODAY'S TIMELINE</div>
        <div id="timeline" class="timeline"></div>
      </div>
    </div>
    <div class="day-card">
      <div class="section-label">TODAY'S SESSIONS</div>
      <div id="sessionList" class="session-list"></div>
    </div>
  </section>
</main>
<script>globalThis.WORK_SESSION_EDITION='lite';</script>
<script src="session-core-1.js"></script>
<script src="session-core-2.js"></script>
<script src="session-core-3.js"></script>
<script src="session-icue-events.js"></script>
</body>
</html>
