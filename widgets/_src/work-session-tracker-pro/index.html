<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="resources/icon.svg" />
<title>tr('Work Session Tracker Pro')</title>
<meta name="x-icue-property" content="dailyGoalMinutes" data-label="tr('Daily Focus Goal')" data-type="slider" data-default="240" data-min="30" data-max="720" data-step="15" data-unit-label="tr('min')" />
<meta name="x-icue-property" content="textColor" data-label="tr('Text Color')" data-type="color" data-default="'#F4F6F8'" />
<meta name="x-icue-property" content="accentColor" data-label="tr('Accent Color')" data-type="color" data-default="'#2BE86A'" />
<meta name="x-icue-property" content="backgroundColor" data-label="tr('Background Color')" data-type="color" data-default="'#07090D'" />
<script type="application/json" id="x-icue-groups">[{"title":"tr('Focus Goal')","properties":["dailyGoalMinutes"]},{"title":"tr('Appearance')","properties":["textColor","accentColor","backgroundColor"]}]</script>
<link rel="stylesheet" href="../work-session-tracker/session-base.css" />
<link rel="stylesheet" href="../work-session-tracker/session-responsive.css" />
</head>
<body data-slot="s-h" data-edition="pro" data-session-state="idle">
<main class="stage" aria-label="Work Session Tracker Pro">
  <section class="current-card">
    <span class="edition">PRO</span>
    <div id="currentLabel" class="eyebrow">READY TO FOCUS</div>
    <h1 id="currentName" class="current-name">What are you working on?</h1>
    <div id="elapsed" class="elapsed">00:00:00</div>
    <div id="idleControls" class="idle-controls">
      <input id="projectInput" maxlength="72" autocomplete="off" aria-label="Session or project name" placeholder="Session or project name" />
      <button id="startButton" class="primary">START</button>
    </div>
    <div id="activeControls" class="active-controls" hidden>
      <button id="pauseResume" class="secondary">PAUSE</button>
      <button id="finishButton" class="secondary finish">FINISH</button>
    </div>
    <div class="utility-row pro-only">
      <button id="colorButton" class="quiet color-button"><span id="colorDot" class="color-dot"></span>COLOR</button>
      <button id="saveProject" class="quiet">SAVE PROJECT</button>
      <button id="breakButton" class="quiet">BREAK</button>
    </div>
    <div id="savedProjects" class="saved-projects pro-only"></div>
  </section>
  <section class="right">
    <div class="summary">
      <div class="today-card">
        <div class="section-label">FOCUSED TODAY</div>
        <div id="todayTotal" class="today-total">0m</div>
        <div id="todayStatus" class="today-status">TODAY</div>
        <div class="goal"><span></span></div>
        <div id="goalProgress" class="goal-caption">0% OF 4h 00m</div>
      </div>
      <div class="timeline-wrap">
        <div class="section-label">TODAY'S TIMELINE</div>
        <div id="timeline" class="timeline"></div>
      </div>
    </div>
    <div class="day-card">
      <div class="section-label">FOCUS HISTORY</div>
      <div class="view-tabs pro-layout">
        <button class="view-tab active" data-view="today">TODAY</button>
        <button class="view-tab" data-view="week">7 DAYS</button>
        <button class="view-tab" data-view="projects">PROJECTS</button>
      </div>
      <div id="sessionList" class="session-list"></div>
      <div class="pro-layout">
        <section data-pro-view="today"><div id="historyRows"></div><button id="deleteLast" class="quiet">DELETE LAST</button></section>
        <section data-pro-view="week" hidden><div class="section-label">7 DAY TOTAL <strong id="weekTotal"></strong></div><div id="weekBars" class="week-bars"></div></section>
        <section data-pro-view="projects" hidden><div id="projectTotals"></div></section>
      </div>
    </div>
  </section>
</main>
<script>globalThis.WORK_SESSION_EDITION='pro';</script>
<script src="../work-session-tracker/session-core-1.js"></script>
<script src="../work-session-tracker/session-core-2.js"></script>
<script src="../work-session-tracker/session-core-3.js"></script>
<script src="../work-session-tracker/session-icue-events.js"></script>
</body>
</html>
