<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="resources/icon.svg" />
<title>tr('Peripheral Battery Panel')</title>

<meta name="x-icue-property" content="lowBatteryThreshold" data-label="tr('Low Battery Threshold')" data-type="slider" data-default="20" data-min="5" data-max="50" data-step="5" data-unit-label="'%'" />
<meta name="x-icue-property" content="textColor" data-label="tr('Text Color')" data-type="color" data-default="'#F4F6F8'" />
<meta name="x-icue-property" content="accentColor" data-label="tr('Accent Color')" data-type="color" data-default="'#2BE86A'" />
<meta name="x-icue-property" content="backgroundColor" data-label="tr('Background Color')" data-type="color" data-default="'#070A0D'" />

<script type="application/json" id="x-icue-groups">
[
  {
    "title": "tr('Battery')",
    "properties": ["lowBatteryThreshold"],
    "info": "tr('Devices are discovered automatically from battery sensors available in iCUE.')"
  },
  {
    "title": "tr('Appearance')",
    "properties": ["textColor", "accentColor", "backgroundColor"]
  }
]
</script>
<link rel="stylesheet" href="battery.css" />
</head>
<body data-slot="s-h" data-panel-state="waiting">
<main id="stage" aria-label="Peripheral Battery Panel">
  <div id="ambient" aria-hidden="true"></div>
  <header id="header">
    <div>
      <div id="eyebrow" class="ui-label">WIRELESS POWER</div>
      <h1 id="panelTitle">Peripheral Battery</h1>
    </div>
    <div id="headerMeta">
      <span id="deviceCount">0 DEVICES</span>
      <span id="freshness">LOWEST FIRST</span>
    </div>
  </header>

  <section id="board" aria-live="polite"></section>

  <section id="statePanel" aria-live="polite">
    <svg id="emptyBattery" viewBox="0 0 96 52" aria-hidden="true">
      <rect x="4" y="6" width="78" height="40" rx="9"></rect>
      <path d="M86 19h6v14h-6"></path>
      <path d="M18 26h18"></path>
    </svg>
    <div id="stateCopy">
      <h2 id="stateTitle">Waiting for iCUE sensors</h2>
      <p id="stateBody">Battery devices will appear automatically.</p>
    </div>
  </section>
</main>
<script src="battery-base.js"></script>
<script src="battery-provider.js"></script>
<script src="battery-ui.js"></script>
</body>
</html>
