<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="resources/icon.svg" />
<title>tr('Now Playing Panel')</title>

<meta name="x-icue-property" content="palettePreset" data-label="tr('Palette')" data-type="tab-buttons" data-default="'artist'" data-values="[{'key':'artist','value':tr('Artist')},{'key':'neon','value':tr('Neon')},{'key':'ember','value':tr('Ember')},{'key':'ocean','value':tr('Ocean')}]" />
<meta name="x-icue-property" content="gradientMotion" data-label="tr('Gradient Motion')" data-type="slider" data-default="35" data-min="0" data-max="100" data-step="5" data-unit-label="'%'" />
<meta name="x-icue-property" content="use24Hour" data-label="tr('24 Hour Time')" data-type="switch" data-default="true" />
<meta name="x-icue-property" content="showHistory" data-label="tr('Show Recent Tracks')" data-type="switch" data-default="true" />

<meta name="x-icue-property" content="textColor" data-label="tr('Text Color')" data-type="color" data-default="'#F4F6F8'" />
<meta name="x-icue-property" content="accentColor" data-label="tr('Accent Color')" data-type="color" data-default="'#2BE86A'" />
<meta name="x-icue-property" content="backgroundColor" data-label="tr('Background Color')" data-type="color" data-default="'#07090D'" />

<script type="application/json" id="x-icue-groups">
[
  {
    "title": "tr('Playback')",
    "properties": ["palettePreset", "gradientMotion", "use24Hour", "showHistory"],
    "info": "tr('Tap the background to cycle palettes. Recent tracks stay on this PC.')"
  },
  {
    "title": "tr('Appearance')",
    "properties": ["textColor", "accentColor", "backgroundColor"]
  }
]
</script>

<link rel="stylesheet" href="now-playing.css" />
</head>
<body data-slot="s-h" data-state="idle" data-palette="artist">
<main id="stage" aria-label="Now Playing Panel">
    <canvas id="gradientCanvas" aria-hidden="true"></canvas>
    <div id="contrastLayer" aria-hidden="true"></div>

    <section id="layout">
        <div id="hero">
            <div id="statusLabel" class="ui-label">SYSTEM MEDIA</div>

            <div id="playingView">
                <div id="titleViewport" class="text-viewport" data-clip="intentional">
                    <div id="trackTitle">Waiting for music</div>
                </div>
                <div id="artistViewport" class="text-viewport" data-clip="intentional">
                    <div id="trackArtist">Windows media session</div>
                </div>
                <div id="artistRule" aria-hidden="true"></div>
            </div>

            <div id="idleView">
                <div id="idleClock">00:00</div>
                <div id="idleStatus">Nothing playing</div>
                <div id="idleHint">Start music in any Windows media app</div>
            </div>

            <div id="paletteBadge" class="ui-label">ARTIST PALETTE</div>
        </div>

        <nav id="transport" aria-label="Media controls">
            <button id="previousControl" class="transport-button interactive" type="button" aria-label="Previous track">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14M18 6l-8 6 8 6z" /></svg>
            </button>
            <button id="playPauseControl" class="transport-button transport-primary interactive" type="button" aria-label="Play or pause">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5v14l7-7zM15 5h3v14h-3z" /></svg>
            </button>
            <button id="nextControl" class="transport-button interactive" type="button" aria-label="Next track">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5v14M6 6l8 6-8 6z" /></svg>
            </button>
        </nav>

        <aside id="historyPanel" aria-label="Recently played">
            <div id="historyHeader">
                <span id="historyTitle" class="ui-label">RECENTLY PLAYED</span>
                <span id="historyCount" class="ui-label">0</span>
            </div>
            <ol id="historyList"></ol>
            <div id="historyEmpty">Tracks appear here as they change.</div>
        </aside>
    </section>
</main>
<script src="now-playing.js"></script>
</body>
</html>
