<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="resources/icon.svg" />
<title>tr('Weather Timeline Pro')</title>
<meta name="x-icue-property" content="location1" data-label="tr('Location')" data-type="textfield" data-default="''" />
<meta name="x-icue-property" content="location2" data-label="tr('Saved Location 2')" data-type="textfield" data-default="''" />
<meta name="x-icue-property" content="location3" data-label="tr('Saved Location 3')" data-type="textfield" data-default="''" />
<meta name="x-icue-property" content="temperatureUnits" data-label="tr('Temperature Units')" data-type="combobox" data-options='[{"key":"auto","value":"Auto (iCUE)"},{"key":"f","value":"Fahrenheit"},{"key":"c","value":"Celsius"}]' data-default="'auto'" />
<meta name="x-icue-property" content="theme" data-label="tr('Theme')" data-type="combobox" data-options='[{"key":"aurora","value":"Aurora"},{"key":"sky","value":"Sky"},{"key":"midnight","value":"Midnight"},{"key":"mono","value":"Mono"},{"key":"ember","value":"Ember"},{"key":"mint","value":"Mint"},{"key":"violet","value":"Violet"},{"key":"glass","value":"Glass"}]' data-default="'aurora'" />
<meta name="x-icue-property" content="refreshMinutes" data-label="tr('Refresh Interval')" data-type="slider" data-min="10" data-max="60" data-step="5" data-unit-label="'min'" data-default="20" />
<meta name="x-icue-property" content="weatherApiKey" data-label="tr('WeatherAPI Key (fallback)')" data-type="textfield" data-default="''" />
<script type="application/json" id="x-icue-groups">[{"title":"tr('Forecast')","properties":["location1","location2","location3","temperatureUnits","refreshMinutes"],"info":"tr('Enter a city, postal code, or latitude,longitude. Leave Location blank for automatic location when iCUE weather access is available.')"},{"title":"tr('Appearance')","properties":["theme"]},{"title":"tr('Fallback Provider')","properties":["weatherApiKey"],"info":"tr('Only needed if iCUE does not provide weather access. Create a free WeatherAPI.com key and paste it here; the key stays in this widget instance.')"}]</script>
<link rel="stylesheet" href="../../_shared/weather-timeline/weather.css" />
<script>window.WEATHER_TIMELINE_CONFIG={pro:true,slug:'weather-timeline-pro'};</script>
</head>
<body data-slot="s-h" data-theme="aurora" data-pro="true">
<main id="weatherStage" data-ready="false" aria-label="Weather Timeline Pro">
<section id="hero" aria-label="Current conditions"><div id="heroTop"><button id="locationButton" class="interactive" type="button" aria-label="Switch saved location"><span id="locationName">Weather</span><span id="locationMeta"></span></button><div class="hero-actions"><button id="refreshButton" class="interactive icon-button" type="button" aria-label="Refresh weather"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0 2 5M20 4v7h-7"/></svg></button><button id="infoButton" class="interactive icon-button" type="button" aria-label="About weather timeline"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 10v7M12 7h.01"/></svg></button></div></div><div id="currentBlock"><div class="current-main"><span id="currentIcon"></span><span id="currentTemp">--°</span></div><div id="currentCondition">Loading forecast</div><div id="highLow">H —  L —</div></div><div id="heroFoot"><span id="statusLabel">LOADING</span><i class="dot"></i><span id="providerLabel"></span></div></section>
<section id="timelineWrap" aria-label="Hourly weather timeline"><div id="timelineHeader"><span class="eyebrow">NEXT 24 HOURS</span><button id="timelinePager" type="button" hidden></button></div><div id="hourRail" aria-label="Hourly forecast"></div></section>
<section id="daysRow" aria-label="Three day outlook" hidden></section>
<section id="setupState" aria-live="polite" hidden><span class="setup-icon">☁</span><span id="setupTitle"></span><span id="setupText"></span><span id="setupHint"></span></section>
<section id="detailPanel" aria-hidden="true" aria-label="Hour details"><span id="detailIcon"></span><div class="detail-copy"><div id="detailWhen"></div><div id="detailCondition"></div></div><div id="detailMetrics"></div><button id="detailClose" class="icon-button" type="button" aria-label="Close details"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></section>
<section id="aboutPanel" aria-hidden="true"><h2>Weather Timeline Pro</h2><p>24 hour weather, three saved locations, richer hourly details, a three day outlook, civil twilight, and extra themes. Forecasts are cached so the last successful data stays readable during a temporary outage.</p><div class="about-actions"><button id="aboutClose" class="text-button" type="button">CLOSE</button><button id="proButton" class="text-button" type="button">VIEW PRO</button></div></section>
</main>
<script src="../../_shared/weather-timeline/weather-core-01.js"></script><script src="../../_shared/weather-timeline/weather-core-02.js"></script><script src="../../_shared/weather-timeline/weather-core-03.js"></script><script src="../../_shared/weather-timeline/weather-core-04.js"></script><script src="../../_shared/weather-timeline/weather-icue-events.js"></script>
</body></html>
