<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="resources/icon.svg" />
<title>tr('Stream Dashboard')</title>

<meta name="x-icue-property" content="obsPort" data-label="tr('OBS WebSocket Port')" data-type="textfield" data-default="'4455'" />
<meta name="x-icue-property" content="obsPassword" data-label="tr('OBS WebSocket Password')" data-type="textfield" data-default="''" />
<meta name="x-icue-property" content="textColor" data-label="tr('Text Color')" data-type="color" data-default="'#F2F5F7'" />
<meta name="x-icue-property" content="accentColor" data-label="tr('Accent Color')" data-type="color" data-default="'#2BE86A'" />
<meta name="x-icue-property" content="backgroundColor" data-label="tr('Background Color')" data-type="color" data-default="'#0B0E11'" />

<script type="application/json" id="x-icue-groups">
[
  {
    "title": "tr('Connection')",
    "properties": ["obsPort", "obsPassword"],
    "info": "tr('Enable the OBS WebSocket server in Tools, then enter the same port and password here.')"
  },
  {
    "title": "tr('Appearance')",
    "properties": ["textColor", "accentColor", "backgroundColor"]
  }
]
</script>

<link rel="stylesheet" href="obs-dashboard.css" />
</head>
<body data-slot="s-h" data-connection="connecting" data-has-cache="false">
<main id="stage" aria-label="Stream Dashboard">
  <div id="gridGlow" aria-hidden="true"></div>

  <section id="dashboard" aria-live="polite">
    <header id="streamHero" class="panel">
      <button id="streamControl" class="state-pill interactive" type="button" aria-label="Start or stop stream">
        <span id="stateDot" aria-hidden="true"></span>
        <span id="stateText">STANDBY</span>
      </button>
      <div id="streamTimer">00:00:00</div>
      <div id="streamSubline" class="label">STREAM OUTPUT</div>
    </header>

    <section id="metricsColumn">
      <article id="bitratePanel" class="panel">
        <div class="metric-head">
          <div>
            <div id="bitrateLabel" class="label">BITRATE</div>
            <div class="metric-value"><span id="bitrateValue">0</span><span class="metric-unit"> kbps</span></div>
          </div>
          <div id="connectionBadge" class="connection-badge">CONNECTING</div>
        </div>
        <svg id="bitrateChart" viewBox="0 0 1000 190" preserveAspectRatio="none" aria-label="60 second bitrate history">
          <path id="bitrateArea" d="" />
          <path id="bitratePath" d="" />
        </svg>
        <div id="chartCaption" class="label">LAST 60 SEC</div>
      </article>

      <div id="healthPanel">
        <article id="droppedCard" class="panel health-card" data-level="good">
          <div class="health-top"><span id="droppedLabel" class="label">DROPPED</span><span id="droppedValue">0.0%</span></div>
          <div class="health-track"><div id="droppedFill" class="health-fill"></div></div>
        </article>
        <article id="encoderCard" class="panel health-card" data-level="good">
          <div class="health-top"><span id="encoderLabel" class="label">ENCODER LAG</span><span id="encoderValue">0.0%</span></div>
          <div class="health-track"><div id="encoderFill" class="health-fill"></div></div>
        </article>
      </div>
    </section>

    <aside id="scenesPanel" class="panel" aria-label="Scenes">
      <div id="sceneHeader">
        <div id="programLabel" class="label">PROGRAM</div>
        <div id="sceneCount" class="label">0 SCENES</div>
      </div>
      <div id="activeScene">No scene</div>
      <div id="sceneRail" role="list" aria-label="Scene list"></div>
    </aside>

    <footer id="footerPanel" class="panel">
      <div id="recordBlock" class="footer-stat">
        <span id="recordDot" class="footer-dot" aria-hidden="true"></span>
        <span id="recordLabel" class="label">REC</span>
        <strong id="recordState">OFF</strong>
        <span id="recordTimer">00:00:00</span>
      </div>
      <div id="diskBlock" class="footer-stat">
        <span id="diskLabel" class="label">DISK FREE</span>
        <strong id="diskValue">-- GB</strong>
      </div>
      <div id="freshnessBlock" class="footer-stat footer-freshness">
        <span id="freshnessDot" class="footer-dot" aria-hidden="true"></span>
        <span id="freshnessText">WAITING FOR OBS</span>
      </div>
    </footer>
  </section>

  <section id="offlineOverlay" role="status">
    <div id="offlineKicker" class="label">STREAM DASHBOARD</div>
    <div id="offlineTitle">CONNECTING TO OBS</div>
    <div id="offlineHint">Open OBS and enable its WebSocket server.</div>
  </section>

  <div id="toast" role="status" aria-live="polite"></div>
</main>
<script src="obs-dashboard.js"></script>
</body>
</html>
