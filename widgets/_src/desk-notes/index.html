<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="resources/icon.svg" />
<title>tr('Desk Notes Lite')</title>
<meta name="x-icue-property" content="boardTitle" data-label="tr('Board Title')" data-type="textfield" data-default="'TODAY'" />
<meta name="x-icue-property" content="boardContent" data-label="tr('Notes')" data-type="textfield" data-default="'[ ] Finish thumbnail&#10;[ ] Upload video&#10;Respond to email&#10;Call dentist'" />
<meta name="x-icue-property" content="noteTheme" data-label="tr('Note Theme')" data-type="combobox" data-default="'midnight'" data-values="[{'key':'midnight','value':tr('Midnight')},{'key':'paper','value':tr('Paper')},{'key':'sage','value':tr('Sage')},{'key':'ocean','value':tr('Ocean')},{'key':'plum','value':tr('Plum')},{'key':'amber','value':tr('Amber')}]" />
<meta name="x-icue-property" content="fontScale" data-label="tr('Font Size')" data-type="slider" data-default="100" data-min="80" data-max="125" data-step="5" data-unit-label="'%'" />
<meta name="x-icue-property" content="textColor" data-label="tr('Text Color')" data-type="color" data-default="'#F4F7FB'" />
<meta name="x-icue-property" content="accentColor" data-label="tr('Accent Color')" data-type="color" data-default="'#65E69C'" />
<meta name="x-icue-property" content="backgroundColor" data-label="tr('Background Color')" data-type="color" data-default="'#07090D'" />
<meta name="x-icue-property" content="transparency" data-label="tr('Background Transparency')" data-type="slider" data-default="0" data-min="0" data-max="90" data-step="5" data-unit-label="'%'" />
<script type="application/json" id="x-icue-groups">
[
  {"title":"tr('Desk Notes Lite')","properties":["boardTitle","boardContent"],"info":"tr('One line becomes one entry. Start a line with [ ] to make it a tappable checklist item. Lite shows up to 8 entries.')"},
  {"title":"tr('Layout')","properties":["noteTheme","fontScale"]},
  {"title":"tr('Appearance')","properties":["textColor","accentColor","backgroundColor","transparency"]}
]
</script>
<link rel="stylesheet" href="../desk-notes-common/desk-notes.css" />
<script>globalThis.DeskNotesConfig={pro:false,maxEntries:8,boardCount:1};globalThis.DESK_NOTES_PRO_MARKETPLACE_URL='';</script>
</head>
<body>
<main id="stage" aria-label="Desk Notes Lite">
  <header id="topbar">
    <div id="titleBlock"><div id="boardTitleView">TODAY</div><div id="progressView"></div></div>
    <nav id="boardTabs" hidden></nav>
    <div class="header-actions"><button id="infoButton" class="header-button" type="button" aria-label="Desk Notes information">i</button></div>
  </header>
  <section id="notesGrid" aria-label="Notes"></section>
  <div id="moreCount" hidden></div>
</main>
<div id="infoOverlay" class="overlay" aria-hidden="true">
  <section class="overlay-card">
    <div class="overlay-title">Desk Notes Pro</div>
    <div class="overlay-copy">Multiple boards, more notes, note cards, categories, pinning, completed history, rotation and more.</div>
    <div class="overlay-actions"><button data-action="view-pro" type="button">View Pro</button><button data-action="close" class="secondary" type="button">Back</button></div>
  </section>
</div>
<script src="../desk-notes-common/desk-notes-core.js"></script>
</body>
</html>
