<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Discord RPC Probe</title>
<style>
html, body { margin: 0; min-height: 100%; background: #090b10; color: #f4f6f8; font-family: Segoe UI, Arial, sans-serif; }
main { max-width: 900px; margin: 0 auto; padding: 40px; }
h1 { margin: 0 0 8px; font-size: 30px; }
p { color: #aeb6c5; line-height: 1.5; }
#status { margin-top: 24px; padding: 18px; border: 1px solid #2a3140; border-radius: 14px; background: #11151d; font-weight: 700; }
#status.pass { border-color: #2be86a; color: #74f49b; }
#status.fail { border-color: #ff5c6c; color: #ff8c98; }
pre { margin-top: 16px; min-height: 220px; padding: 18px; overflow: auto; border-radius: 14px; background: #05070a; color: #cbd3df; white-space: pre-wrap; }
button { margin-top: 16px; min-height: 48px; padding: 0 18px; border: 1px solid #2be86a; border-radius: 12px; background: #102419; color: #f4f6f8; font: inherit; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<main>
<h1>Discord RPC real Client ID probe</h1>
<p>This page must be opened directly from disk so its browser origin is the literal value <code>null</code>. It tries Discord RPC ports 6463 through 6472 using the PackRat Discord Voice Panel application ID.</p>
<div id="status">Running probe...</div>
<button id="retry" type="button">Run again</button>
<pre id="log"></pre>
</main>
<script>
var CLIENT_ID = "1540927508302536724";
var FIRST_PORT = 6463;
var LAST_PORT = 6472;
var logNode = document.getElementById("log");
var statusNode = document.getElementById("status");

function log(value) {
  logNode.textContent += value + "\n";
}

function tryPort(port) {
  return new Promise(function (resolve) {
    var finished = false;
    var url = "ws://127.0.0.1:" + port + "/?v=1&client_id=" + encodeURIComponent(CLIENT_ID) + "&encoding=json";
    log("Trying " + url);
    var socket;
    try {
      socket = new WebSocket(url);
    } catch (error) {
      log("Constructor failed on " + port + ": " + error.message);
      resolve(null);
      return;
    }
    var timer = setTimeout(function () {
      if (finished) return;
      finished = true;
      log("Timeout on " + port);
      try { socket.close(); } catch (error) { }
      resolve(null);
    }, 1800);

    socket.addEventListener("open", function () {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      log("OPEN on port " + port);
      resolve({ socket: socket, port: port });
    }, { once: true });

    socket.addEventListener("error", function () {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      log("WebSocket error on " + port);
      resolve(null);
    }, { once: true });

    socket.addEventListener("close", function (event) {
      log("CLOSE on " + port + " code=" + event.code + " reason=" + (event.reason || "<none>"));
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      resolve(null);
    });
  });
}

async function run() {
  logNode.textContent = "";
  statusNode.className = "";
  statusNode.textContent = "Running probe...";
  log("document.origin: " + (location.origin || "<empty>"));
  log("expected origin: null");
  for (var port = FIRST_PORT; port <= LAST_PORT; port += 1) {
    var result = await tryPort(port);
    if (!result) continue;
    statusNode.className = "pass";
    statusNode.textContent = "PASS: Discord accepted the real Client ID from Origin null on port " + result.port;
    result.socket.addEventListener("message", function (event) {
      log("MESSAGE: " + event.data);
    });
    setTimeout(function () {
      try { result.socket.close(1000, "probe complete"); } catch (error) { }
    }, 1200);
    return;
  }
  statusNode.className = "fail";
  statusNode.textContent = "FAIL: no Discord RPC port accepted the real Client ID from this file origin";
}

document.getElementById("retry").addEventListener("click", run);
run();
</script>
</body>
</html>
