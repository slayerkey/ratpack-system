      resolve(null);
    }, 4000);
    sensorPending[id] = { resolve: resolve, timer: timer };
    try { plugin[method].apply(plugin, [id].concat(args || [])); }
    catch (e) {
      clearTimeout(timer);
      delete sensorPending[id];
      resolve(null);
    }
  });
}

function scheduleScan(delay) {
  clearTimeout(rescanTimer);
  rescanTimer = setTimeout(scanSensors, delay == null ? 120 : delay);
}

function connectSensorEvents(plugin) {
  if (!plugin || sensorEventsPlugin === plugin) return;
  try {
    if (plugin.sensorAdded && typeof plugin.sensorAdded.connect === "function") {
      plugin.sensorAdded.connect(function () { scheduleScan(80); });
    }
    if (plugin.sensorRemoved && typeof plugin.sensorRemoved.connect === "function") {
      plugin.sensorRemoved.connect(function () { scheduleScan(80); });
    }
    if (plugin.sensorDataChanged && typeof plugin.sensorDataChanged.connect === "function") {
      plugin.sensorDataChanged.connect(function (sensorId) {
        if (sensorToCard[String(sensorId)]) scheduleScan(110);
      });
    }
    if (plugin.sensorUnitsChanged && typeof plugin.sensorUnitsChanged.connect === "function") {
      plugin.sensorUnitsChanged.connect(function (sensorId) {
        if (sensorToCard[String(sensorId)]) scheduleScan(110);
      });
    }
    if (plugin.sensorValueChanged && typeof plugin.sensorValueChanged.connect === "function") {
      plugin.sensorValueChanged.connect(function (sensorId, value) {
        updateOneSensor(String(sensorId), value);
      });
    }
    sensorEventsPlugin = plugin;
  } catch (e) { }
}

function parsePercent(value) {
  if (value === null || value === undefined) return null;
  var match = String(value).replace(",", ".").match(/-?\d+(?:\.\d+)?/);
  if (!match) return null;
  var number = Number(match[0]);
  if (!Number.isFinite(number)) return null;
  return Math.max(0, Math.min(100, number));
}

function parseEtaMinutes(value, units) {
  var text = String(value == null ? "" : value).trim();
  var unit = String(units == null ? "" : units).trim().toLowerCase();
  if (!text) return null;

  var clock = text.match(/\b(\d{1,2}):(\d{2})\b/);
  if (clock) {
    var hours = Number(clock[1]);
    var minutes = Number(clock[2]);
    if (minutes < 60 && hours <= 72) return hours * 60 + minutes;
  }

  var hourText = text.match(/\b(\d+(?:\.\d+)?)\s*(?:h|hr|hrs|hour|hours)\b/i);
  var minuteText = text.match(/\b(\d+(?:\.\d+)?)\s*(?:m|min|mins|minute|minutes)\b/i);
  if (hourText || minuteText) {
    return Math.round((hourText ? Number(hourText[1]) * 60 : 0) + (minuteText ? Number(minuteText[1]) : 0));
  }

  var numeric = text.match(/^\s*(\d+(?:\.\d+)?)\s*$/);
  if (numeric && /^(min|mins|minute|minutes)$/.test(unit)) return Math.round(Number(numeric[1]));
  if (numeric && /^(h|hr|hrs|hour|hours)$/.test(unit)) return Math.round(Number(numeric[1]) * 60);
  return null;
}

function statusInfo(value, units) {
  var raw = String(value == null ? "" : value).trim();
  var lower = raw.toLowerCase();
  var eta = parseEtaMinutes(raw, units);
  var state = "unknown";
  if (/not charging|discharg|on battery/.test(lower)) state = "discharging";
  else if (/charging|recharging|charge in progress/.test(lower)) state = "charging";
  else if (/fully charged|full charge|\bfull\b/.test(lower)) state = "full";
  return { raw: raw, state: state, etaMinutes: eta };
}
</script>
<script>
function normalizeName(value, fallback) {
  var name = String(value == null ? "" : value).trim();
  return name || String(fallback || "").trim() || wirelessDeviceLabel;
}

async function inspectSensor(sensorId, type) {
  var result = await Promise.all([
    ask("sensorIsConnected", [sensorId]),
    ask("getSensorDeviceName", [sensorId]),
    ask("getSensorName", [sensorId]),
    ask("getSensorUnits", [sensorId]),
    ask("getSensorValue", [sensorId])
  ]);
  if (result[0] === false) return null;
  return {
    id: String(sensorId),
    type: type,
    connected: result[0] !== false,
    deviceName: String(result[1] || "").trim(),
    sensorName: String(result[2] || "").trim(),
    units: String(result[3] || "").trim(),
    value: result[4]
  };
}

function pairDevices(sensors) {
  var groups = {};
  sensors.forEach(function (sensor, index) {
    if (!sensor) return;
    var base = normalizeName(sensor.deviceName, sensor.sensorName);
    if (!groups[base]) groups[base] = { charges: [], statuses: [] };
    sensor.order = index;
    if (sensor.type === "battery-charge") groups[base].charges.push(sensor);
    else if (sensor.type === "battery-status") groups[base].statuses.push(sensor);
  });

  var out = [];
  Object.keys(groups).forEach(function (baseName) {
    var group = groups[baseName];
    group.charges.sort(function (a, b) { return a.order - b.order; });
    group.statuses.sort(function (a, b) { return a.order - b.order; });
    group.charges.forEach(function (chargeSensor, index) {
      var statusSensor = group.statuses[index] || null;
      var pct = parsePercent(chargeSensor.value);
      var status = statusSensor ? statusInfo(statusSensor.value, statusSensor.units) : { raw: "", state: "unknown", etaMinutes: null };
      var suffix = group.charges.length > 1 ? " " + (index + 1) : "";
      out.push({
        key: baseName + "\u0000" + index,
        name: baseName + suffix,
        baseName: baseName,
        percentage: pct,
        chargeSensorId: chargeSensor.id,
        statusSensorId: statusSensor ? statusSensor.id : "",
        statusRaw: status.raw,
        statusState: status.state,
        etaMinutes: status.etaMinutes,
        live: true
      });
    });
  });

  out.sort(function (a, b) {
    var ap = a.percentage == null ? 101 : a.percentage;
    var bp = b.percentage == null ? 101 : b.percentage;
    if (ap !== bp) return ap - bp;
    return a.name.localeCompare(b.name);
  });
  return out;
}

function rebuildSensorMap() {
  sensorToCard = {};
  cards.forEach(function (card) {
    if (card.chargeSensorId) sensorToCard[card.chargeSensorId] = card.key;
    if (card.statusSensorId) sensorToCard[card.statusSensorId] = card.key;
  });
}

async function updateOneSensor(sensorId, value) {
  var key = sensorToCard[sensorId];
  if (!key) return;
  var card = cards.find(function (item) { return item.key === key; });
  if (!card) return;
  if (card.chargeSensorId === sensorId) {
    card.percentage = parsePercent(value);
  } else if (card.statusSensorId === sensorId) {
    var units = await ask("getSensorUnits", [sensorId]);
    var info = statusInfo(value, units);
    card.statusRaw = info.raw;
    card.statusState = info.state;
    card.etaMinutes = info.etaMinutes;
  }
  cards.sort(function (a, b) {
    var ap = a.percentage == null ? 101 : a.percentage;
    var bp = b.percentage == null ? 101 : b.percentage;
    if (ap !== bp) return ap - bp;
    return a.name.localeCompare(b.name);
  });
  storeLiveCards();
  renderCards();
}

function storeLiveCards() {
  var payload = cards.filter(function (card) { return card.live; }).map(function (card) {
    return {
      key: card.key,
      name: card.name,
      baseName: card.baseName,
      percentage: card.percentage,
      chargeSensorId: card.chargeSensorId,
      statusSensorId: card.statusSensorId,
      statusRaw: card.statusRaw,
      statusState: card.statusState,
      etaMinutes: card.etaMinutes,
      live: false
    };
  });
  if (payload.length) storeWrite("last-good", { at: Date.now(), cards: payload });
}

function restoreCache() {
  var cached = storeRead("last-good", null);
  if (!cached || !Array.isArray(cached.cards) || !cached.cards.length) return false;
  cards = cached.cards.map(function (card) {
    card.live = false;
    return card;
  });
  rebuildSensorMap();
  document.body.setAttribute("data-panel-state", "ready");
  setFreshness(true);
  renderCards();
  return true;
}

async function scanSensors() {
  if (scanRunning) return;
  scanRunning = true;
  try {
    var plugin = sensorPlugin();
    if (!plugin) {
      if (!cards.length && !restoreCache()) await showState("unavailable");
      else setFreshness(true);
      return;
    }
    connectAsync(plugin);
    connectSensorEvents(plugin);

    var ids = await ask("getAllSensorIds", []);
    if (!Array.isArray(ids)) {
      if (!cards.length && !restoreCache()) await showState("unavailable");
      else setFreshness(true);
      return;
    }

    var types = await Promise.all(ids.map(function (sensorId) { return ask("getSensorType", [sensorId]); }));
    var candidates = [];
    ids.forEach(function (sensorId, index) {
      var type = String(types[index] || "").trim().toLowerCase();
      if (type === "battery-charge" || type === "battery-status") candidates.push({ id: String(sensorId), type: type });
    });

    if (!candidates.length) {
      cards = [];
      sensorToCard = {};
      storeWrite("last-good", null);
      lastLiveScan = Date.now();
      await showState("empty");
      return;
    }

    var inspected = await Promise.all(candidates.map(function (item) { return inspectSensor(item.id, item.type); }));
    cards = pairDevices(inspected.filter(Boolean));
    rebuildSensorMap();
    lastLiveScan = Date.now();

    if (!cards.length) {
      storeWrite("last-good", null);
      await showState("empty");
      return;
    }

    document.body.setAttribute("data-panel-state", "ready");
    setFreshness(false);
    storeLiveCards();
    renderCards();
  } finally {
    scanRunning = false;
  }
}
</script>
<script>
function levelColor(percent, threshold) {
  if (percent == null) return "#8D98A7";
  if (percent <= threshold) return "#FF5C62";
  if (percent <= Math.max(threshold + 15, 35)) return "#F3B342";
  return "var(--accent)";
}

function formatEta(minutes) {
  if (minutes == null || !Number.isFinite(minutes) || minutes < 0) return "";
  var total = Math.round(minutes);
  var hours = Math.floor(total / 60);
  var mins = total % 60;
  if (hours && mins) return hours + "h " + mins + "m";
  if (hours) return hours + "h";
  return mins + "m";
}

async function statusLabel(card) {
  if (card.statusState === "charging") return await t("Charging");
  if (card.statusState === "full") return await t("Full");
  if (card.statusState === "discharging") return await t("Discharging");
  return await t("Battery");
}

function boltSvg() {
  return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 5.5 13H11l-1 9L18.5 10H13l0-8Z"></path></svg>';
}

async function renderCards() {
  var board = document.getElementById("board");
  if (!board || document.body.getAttribute("data-panel-state") !== "ready") return;
  board.replaceChildren();
  board.setAttribute("data-count", String(Math.min(cards.length, 9)));
  var cfg = readSettings();
  var batteryWord = await t("Battery");
  var countText = cards.length + " " + (cards.length === 1 ? await t("DEVICE") : await t("DEVICES"));
  setText("deviceCount", countText);

  for (var i = 0; i < cards.length; i++) {
    var card = cards[i];
    var article = document.createElement("article");
    article.className = "battery-card interactive";
    article.tabIndex = 0;
    article.setAttribute("role", "button");
    article.setAttribute("data-key", card.key);
    article.setAttribute("aria-label", card.name + " " + batteryWord);

    var pct = card.percentage;
    var color = levelColor(pct, cfg.threshold);
    article.style.setProperty("--charge", pct == null ? "0%" : pct + "%");
    article.style.setProperty("--level-color", color);
    if (pct != null && pct <= cfg.threshold) article.classList.add("is-low");
    else if (pct != null && pct <= Math.max(cfg.threshold + 15, 35)) article.classList.add("is-warning");
    if (card.statusState === "charging") article.classList.add("is-charging");

    var top = document.createElement("div");
    top.className = "card-top";
    var name = document.createElement("div");
    name.className = "device-name";
    name.textContent = card.name;
    top.appendChild(name);

    var statusRow = document.createElement("div");
    statusRow.className = "status-row";
    var badge = document.createElement("div");
    badge.className = "status-badge" + (card.statusState === "charging" ? " charging" : "");
    if (card.statusState === "charging") badge.innerHTML = boltSvg();
    var badgeText = document.createElement("span");
    badgeText.textContent = await statusLabel(card);
    badge.appendChild(badgeText);
    statusRow.appendChild(badge);
    top.appendChild(statusRow);

    var metricRow = document.createElement("div");
    metricRow.className = "metric-row";
    var metricWrap = document.createElement("div");
    metricWrap.className = "metric-wrap";
    var metric = document.createElement("div");
    metric.className = "metric";
    var caption = document.createElement("div");
    caption.className = "metric-caption";
    var detail = detailModes[card.key] === true;

    if (!detail) {
      if (pct == null) metric.textContent = "--";
      else {
        metric.textContent = String(Math.round(pct));
        var unit = document.createElement("small");
        unit.textContent = "%";
        metric.appendChild(unit);
      }
      caption.textContent = await t("Charge level");
    } else if (card.etaMinutes != null) {
      metric.textContent = formatEta(card.etaMinutes);
      caption.textContent = await t("Remaining");
    } else if (card.statusState !== "unknown") {
      metric.textContent = await statusLabel(card);
      caption.textContent = await t("Battery status");
    } else {
      metric.textContent = await t("No estimate");
      caption.textContent = await t("Estimate unavailable");
    }
    metricWrap.appendChild(metric);
    metricWrap.appendChild(caption);
    metricRow.appendChild(metricWrap);

    var hint = document.createElement("div");
    hint.className = "card-hint";
    hint.textContent = detail ? await t("Tap to show percentage") : await t("Tap for battery detail");
    metricRow.appendChild(hint);

    var bottom = document.createElement("div");
    bottom.className = "card-bottom";
    var track = document.createElement("div");
    track.className = "battery-track";
    var fill = document.createElement("div");
    fill.className = "battery-fill";
    track.appendChild(fill);
    bottom.appendChild(track);

    article.appendChild(top);
    article.appendChild(metricRow);
    article.appendChild(bottom);

    article.addEventListener("click", function () { toggleCard(this.getAttribute("data-key")); });
    article.addEventListener("keydown", function (event) {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        toggleCard(this.getAttribute("data-key"));
      }
    });
    board.appendChild(article);
  }
}

function toggleCard(key) {
  if (!key) return;
  detailModes[key] = !detailModes[key];
  renderCards();
}

async function setFreshness(stale) {
  var el = document.getElementById("freshness");
  if (!el) return;
  el.classList.toggle("stale", !!stale);
  el.textContent = stale ? await t("Last known readings") : await t("LOWEST FIRST");
}

async function showState(state) {
  document.body.setAttribute("data-panel-state", state);
  setText("deviceCount", "0 " + await t("DEVICES"));
  await setFreshness(false);
  if (state === "empty") {
    setText("stateTitle", await t("No battery sensors found"));
    setText("stateBody", await t("This panel reads supported Corsair wireless devices through iCUE. Connect a wireless device to see its battery here."));
  } else if (state === "unavailable") {
    setText("stateTitle", await t("iCUE sensor service unavailable"));
    setText("stateBody", await t("The panel will reconnect automatically."));
  } else {
    setText("stateTitle", await t("Waiting for iCUE sensors"));
    setText("stateBody", await t("Battery devices will appear automatically."));
  }
}

async function translateStatic() {
  wirelessDeviceLabel = await t("Wireless device");
  setText("eyebrow", await t("WIRELESS POWER"));
  setText("panelTitle", await t("Peripheral Battery"));
  document.getElementById("stage").setAttribute("aria-label", await t("Peripheral Battery Panel"));
  translationsReady = true;
  if (document.body.getAttribute("data-panel-state") === "ready") {
    await setFreshness(cards.some(function (card) { return !card.live; }));
    renderCards();
  } else {
    await showState(document.body.getAttribute("data-panel-state") || "waiting");
  }
}

function startWidget() {
  if (started) return;
  started = true;
  applySlot();
  applySettings();
  showState("waiting");
  translateStatic();
  restoreCache();
  window.addEventListener("resize", applySlot);
  scanSensors();
  reconcileTimer = setInterval(scanSensors, 30000);
}

icueEvents = {
  onICUEInitialized: function () {
    applySettings();
    translateStatic();
    scanSensors();
  },
  onDataUpdated: function () {
    applySettings();
    translateStatic();
  }
};

pluginSensorsdataproviderEvents = {
  onInitialized: function () {
    scheduleScan(0);
  }
};

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", startWidget);
else startWidget();
</script>
